p>Báo chí, press kit, sự kiện</p></div></div><div class=\"step\"><span class=\"stepnum\">09</span><div><strong>09. Campaigns</strong><p>Chiến dịch và nội dung xuất bản</p></div></div><div class=\"step\"><span class=\"stepnum\">10</span><div><strong>10. Reports &amp; Archive</strong><p>Báo cáo, KPI, lưu trữ</p></div></div></div></div>\n<p>Mỗi tài nguyên cần có thông tin về ngày tạo, nguồn, người thực hiện, quyền sử dụng, trạng thái phê duyệt và phân loại rõ hình ảnh thực tế, phối cảnh, hình ảnh minh họa hoặc nội dung được tạo bằng công nghệ AI.</p>\n", "headings": [{"id": "m22", "title": "22. Ma trận nội dung truyền thông năm 2027", "level": 2}, {"id": "m22-1", "title": "22.1. Phân bổ nguồn lực theo cấu phần", "level": 3}, {"id": "m23", "title": "23. Xây dựng các series truyền thông dài hạn", "level": 2}, {"id": "m24", "title": "24. Chiến lược sản xuất tài nguyên truyền thông", "level": 2}, {"id": "m24-1", "title": "24.1. Hệ thống video", "level": 3}, {"id": "m24-2", "title": "24.2. Hệ thống hình ảnh và thiết kế", "level": 3}, {"id": "m24-3", "title": "24.3. Quản trị kho tài nguyên truyền thông", "level": 3}]}, {"p": 6, "title": "PHẦN VI. LỘ TRÌNH TRIỂN KHAI NĂM 2027", "html": "\n<h2 id=\"m25\">25. Chiến lược triển khai theo quý</h2>\n<div class=\"visual\"><div class=\"quartergrid\"><div class=\"tile quarter\"><span>Q1 · Tháng 1–3</span><h4>Xác lập thương hiệu – Ra mắt sản phẩm</h4><p>Hoàn thiện nền tảng thương hiệu, tập trung FARM và FOOD, thương mại hóa sản phẩm gà, triển khai chiến dịch Tết 2027 và truyền thông các năng lực ADIGO đã sẵn sàng.</p></div><div class=\"tile quarter\"><span>Q2 · Tháng 4–6</span><h4>Củng cố niềm tin – Phát triển danh mục</h4><p>Truyền thông chất lượng, trải nghiệm khách hàng, chuẩn bị danh mục sản phẩm tiếp theo và làm rõ năng lực ORGANIC DISTRIBUTION.</p></div><div class=\"tile quarter\"><span>Q3 · Tháng 7–9</span><h4>Mở rộng thị trường – Kết nối hệ sinh thái</h4><p>Phát triển truyền thông đối tác, nhà cung cấp, hệ thống phân phối, bán lẻ và các giải pháp ADIGO phù hợp tiến độ vận hành.</p></div><div class=\"tile quarter\"><span>Q4 · Tháng 10–12</span><h4>Nâng cao vị thế – Tích hợp giá trị</h4><p>Truyền thông tổng thể hệ sinh thái, tổng kết năng lực, phát triển quan hệ chiến lược và chuẩn bị kế hoạch năm 2028.</p></div></div></div>\n<h2 id=\"m26\">26. Kế hoạch truyền thông theo 12 tháng</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Tháng</th>\n<th>Chủ đề trọng tâm</th>\n<th>Hoạt động chính</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>01</strong></td>\n<td>Hành trình sản phẩm đầu tiên</td>\n<td>Giới thiệu vùng sản xuất, mô hình nuôi, hoàn thiện bao bì, catalog, TVC và chuẩn bị ra mắt</td>\n</tr>\n<tr>\n<td><strong>02</strong></td>\n<td>Tết cùng Organic Việt Nam</td>\n<td>Truyền thông sản phẩm gà, điểm bán, trải nghiệm khách hàng và hỗ trợ thương mại</td>\n</tr>\n<tr>\n<td><strong>03</strong></td>\n<td>Chất lượng tạo dựng niềm tin</td>\n<td>Đánh giá chiến dịch, phản hồi khách hàng, truyền thông chất lượng, Farm Tour</td>\n</tr>\n<tr>\n<td><strong>04</strong></td>\n<td>Phát triển chuỗi giá trị</td>\n<td>Giới thiệu FARM – FOOD – DISTRIBUTION và chuẩn bị danh mục tiếp theo</td>\n</tr>\n<tr>\n<td><strong>05</strong></td>\n<td>Giá trị từ thảo dược</td>\n<td>Truyền thông vùng dược liệu, trồng trọt và mô hình ứng dụng thảo dược</td>\n</tr>\n<tr>\n<td><strong>06</strong></td>\n<td>Công nghệ và minh bạch</td>\n<td>ADIGO, dữ liệu, truy xuất và quản trị vận hành</td>\n</tr>\n<tr>\n<td><strong>07</strong></td>\n<td>Kết nối nguồn cung và thị trường</td>\n<td>Nhà cung cấp, đại lý, đối tác và năng lực phân phối</td>\n</tr>\n<tr>\n<td><strong>08</strong></td>\n<td>Con người và cộng đồng</td>\n<td>Văn hóa doanh nghiệp, nhân sự, chuyên gia, cộng đồng</td>\n</tr>\n<tr>\n<td><strong>09</strong></td>\n<td>Trải nghiệm thương hiệu</td>\n<td>Khách hàng, điểm bán, dịch vụ và các chương trình trải nghiệm</td>\n</tr>\n<tr>\n<td><strong>10</strong></td>\n<td>Hệ sinh thái Organic – ADIGO</td>\n<td>Chiến dịch tích hợp, năng lực công nghệ và mô hình tạo giá trị</td>\n</tr>\n<tr>\n<td><strong>11</strong></td>\n<td>Đồng hành phát triển</td>\n<td>Hội nghị đối tác, nhà cung cấp, cơ hội hợp tác và kết nối thị trường</td>\n</tr>\n<tr>\n<td><strong>12</strong></td>\n<td>Hành trình một năm kiến tạo</td>\n<td>Tổng kết năm 2027, báo cáo thương hiệu và định hướng năm 2028</td>\n</tr>\n</tbody>\n</table></div>\n<p>Đây là lịch chủ đề cấp chiến lược. Mỗi tháng cần xây dựng kế hoạch tác nghiệp riêng, bao gồm danh mục công việc, lịch sản xuất, lịch xuất bản, người phụ trách, ngân sách và KPI.</p>\n<h2 id=\"m27\">27. Danh mục chiến dịch cấp doanh nghiệp</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Mã</th>\n<th>Chiến dịch</th>\n<th>Thời gian</th>\n<th>Cấu phần trọng tâm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CAM-01</td>\n<td>Kiến tạo hệ sinh thái giá trị</td>\n<td>Xuyên suốt</td>\n<td>ORGANIC VIỆT NAM</td>\n</tr>\n<tr>\n<td>CAM-02</td>\n<td>Hành trình sản phẩm đầu tiên</td>\n<td>Q1</td>\n<td>FARM, FOOD</td>\n</tr>\n<tr>\n<td>CAM-03</td>\n<td>Tết cùng Organic Việt Nam</td>\n<td>Q1</td>\n<td>FOOD, DISTRIBUTION, bán lẻ</td>\n</tr>\n<tr>\n<td>CAM-04</td>\n<td>Chất lượng từ quy trình</td>\n<td>Q1–Q2</td>\n<td>FARM, FOOD, ADIGO</td>\n</tr>\n<tr>\n<td>CAM-05</td>\n<td>Giá trị từ thảo dược</td>\n<td>Q2–Q3</td>\n<td>FARM</td>\n</tr>\n<tr>\n<td>CAM-06</td>\n<td>Hành trình từ sản xuất đến bàn ăn</td>\n<td>Q2–Q4</td>\n<td>FARM, FOOD, DISTRIBUTION</td>\n</tr>\n<tr>\n<td>CAM-07</td>\n<td>ADIGO – Công nghệ kết nối giá trị</td>\n<td>Q2–Q4</td>\n<td>ADIGO</td>\n</tr>\n<tr>\n<td>CAM-08</td>\n<td>Trải nghiệm cùng Organic Việt Nam</td>\n<td>Q2–Q4</td>\n<td>FOOD, bán lẻ</td>\n</tr>\n<tr>\n<td>CAM-09</td>\n<td>Đồng hành kiến tạo giá trị</td>\n<td>Q3–Q4</td>\n<td>Đối tác, nhà cung cấp</td>\n</tr>\n<tr>\n<td>CAM-10</td>\n<td>Kết nối thị trường</td>\n<td>Theo tiến độ</td>\n<td>ADIGO MARKETPLACE</td>\n</tr>\n<tr>\n<td>CAM-11</td>\n<td>Hành trình một năm kiến tạo</td>\n<td>Q4</td>\n<td>Toàn hệ sinh thái</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Tiến độ triển khai các chiến dịch</h3>\n<div class=\"visual\"><div class=\"gantt\"><div class=\"ganttrow\"><strong>Chiến dịch</strong><div class=\"ganttgrid\"><b>Q1</b><b>Q2</b><b>Q3</b><b>Q4</b></div></div><div class=\"ganttrow\"><span>Thương hiệu doanh nghiệp</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:1/span 4\"></i></div></div><div class=\"ganttrow\"><span>Ra mắt sản phẩm gà</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:1/span 1\"></i></div></div><div class=\"ganttrow\"><span>Chiến dịch Tết</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:1/span 1\"></i></div></div><div class=\"ganttrow\"><span>Chất lượng sản phẩm</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:1/span 2\"></i></div></div><div class=\"ganttrow\"><span>Giá trị thảo dược</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:2/span 2\"></i></div></div><div class=\"ganttrow\"><span>Chuỗi giá trị</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:2/span 3\"></i></div></div><div class=\"ganttrow\"><span>Công nghệ ADIGO</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:2/span 3\"></i></div></div><div class=\"ganttrow\"><span>Trải nghiệm khách hàng</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:2/span 3\"></i></div></div><div class=\"ganttrow\"><span>Đối tác &amp; nguồn cung</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:3/span 2\"></i></div></div><div class=\"ganttrow\"><span>Tổng kết thương hiệu</span><div class=\"ganttgrid trackgrid\"><i style=\"grid-column:4/span 1\"></i></div></div></div><p class=\"figcaption\">Tiến độ dự kiến, chưa bao gồm các chiến dịch phát sinh hoặc cấu phần chưa đủ điều kiện ra mắt.</p></div>\n<h2 id=\"m28\">28. Kế hoạch trọng điểm 90 ngày trước và trong giai đoạn ra mắt sản phẩm đầu tiên</h2>\n<h3 id=\"m28-1\">28.1. Giai đoạn chuẩn bị cuối năm 2026</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Thời gian</th>\n<th>Công việc trọng điểm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>24–30/11/2026</td>\n<td>Chốt chiến lược, nhân sự, định vị, thông điệp và danh mục công việc</td>\n</tr>\n<tr>\n<td>01–10/12/2026</td>\n<td>Hoàn thiện nhận diện, kế hoạch nội dung, kịch bản, thu thập tư liệu</td>\n</tr>\n<tr>\n<td>11–20/12/2026</td>\n<td>Sản xuất video, hoàn thiện website, thiết kế bao bì, catalog, tờ rơi</td>\n</tr>\n<tr>\n<td>21–31/12/2026</td>\n<td>Hoàn thiện bộ tài liệu bán hàng, kế hoạch ra mắt, kết nối báo chí và đối tác</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"m28-2\">28.2. Giai đoạn truyền thông trước thương mại</h3>\n<p>Tập trung giúp thị trường hiểu Organic Việt Nam, nguồn gốc sản phẩm, mô hình chăn nuôi ứng dụng thảo dược, quá trình hoàn thiện sản phẩm và năng lực kiểm soát chất lượng.</p>\n<p>Đồng thời phối hợp với Marketing và Kinh doanh tiếp nhận nhu cầu, chuẩn bị dữ liệu khách hàng, triển khai nội dung cho đội ngũ Sale, CTV và hệ thống điểm bán.</p>\n<h3 id=\"m28-3\">28.3. Giai đoạn thương mại hóa</h3>\n<p>Tập trung chiến dịch ra mắt sản phẩm gà, truyền thông điểm bán, quy cách sản phẩm, chương trình trải nghiệm, phản hồi khách hàng và hỗ trợ các kênh phân phối.</p>\n<p>Do kế hoạch sản xuất được tổ chức theo lứa gối đầu, chiến dịch truyền thông cũng cần được triển khai theo chu kỳ tương ứng.</p>\n<div class=\"visual\"><h4>Chu kỳ truyền thông theo từng lứa sản phẩm</h4><div class=\"steps\"><div class=\"step\"><span class=\"stepnum\">01</span><div><strong>Trước ngày mở bán 7–14 ngày</strong><p>Giới thiệu lứa sản phẩm, nguồn gốc, thông tin chất lượng và tiếp nhận nhu cầu.</p></div></div><div class=\"step\"><span class=\"stepnum\">02</span><div><strong>Ngày mở bán</strong><p>Công bố sản phẩm, quy cách, kênh mua hàng và nội dung chiến dịch.</p></div></div><div class=\"step\"><span class=\"stepnum\">03</span><div><strong>Ngày 1–7</strong><p>Tăng cường nội dung tại điểm bán, trải nghiệm, hướng dẫn và phản hồi khách hàng.</p></div></div><div class=\"step\"><span class=\"stepnum\">04</span><div><strong>Ngày 8–14</strong><p>Phối hợp Kinh doanh theo dõi sức mua, điều chỉnh nội dung và hỗ trợ hoàn thành mục tiêu từng lứa.</p></div></div><div class=\"step\"><span class=\"stepnum\">05</span><div><strong>Kết thúc chu kỳ</strong><p>Đánh giá hiệu quả, phản hồi chất lượng, cải tiến và chuẩn bị lứa tiếp theo.</p></div></div></div></div>\n<p>Truyền thông cần bám sát mục tiêu bán hết từng lứa trong vòng hai tuần, nhưng không chịu trách nhiệm thay cho Kinh doanh về doanh số, tồn kho hoặc khả năng cung ứng.</p>\n<h3 id=\"m28-4\">28.4. Điều kiện kích hoạt chiến dịch thương mại</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Điều kiện</th>\n<th>Đơn vị xác nhận</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nguồn cung và lịch xuất bán</td>\n<td>FARM, Kinh doanh</td>\n</tr>\n<tr>\n<td>Hồ sơ chất lượng và điều kiện sản phẩm</td>\n<td>FOOD, QA, pháp chế</td>\n</tr>\n<tr>\n<td>Quy cách, giá và chính sách bán hàng</td>\n<td>Kinh doanh</td>\n</tr>\n<tr>\n<td>Bao bì, tem nhãn, thông tin công bố</td>\n<td>FOOD, QA, Truyền thông</td>\n</tr>\n<tr>\n<td>Năng lực lưu kho, giao nhận</td>\n<td>DISTRIBUTION</td>\n</tr>\n<tr>\n<td>Tính năng công nghệ được giới thiệu</td>\n<td>ADIGO, Công nghệ</td>\n</tr>\n<tr>\n<td>Kênh bán hàng và tiếp nhận đơn</td>\n<td>Marketing, Kinh doanh</td>\n</tr>\n<tr>\n<td>Nội dung và kế hoạch truyền thông</td>\n<td>Giám đốc Truyền thông</td>\n</tr>\n</tbody>\n</table></div>\n<p>Mốc ra mắt được quyết định trên cơ sở mức độ sẵn sàng thực tế của toàn chuỗi giá trị, không chỉ dựa vào lịch truyền thông.</p>\n", "headings": [{"id": "m25", "title": "25. Chiến lược triển khai theo quý", "level": 2}, {"id": "m26", "title": "26. Kế hoạch truyền thông theo 12 tháng", "level": 2}, {"id": "m27", "title": "27. Danh mục chiến dịch cấp doanh nghiệp", "level": 2}, {"id": "m28", "title": "28. Kế hoạch trọng điểm 90 ngày trước và trong giai đoạn ra mắt sản phẩm đầu tiên", "level": 2}, {"id": "m28-1", "title": "28.1. Giai đoạn chuẩn bị cuối năm 2026", "level": 3}, {"id": "m28-2", "title": "28.2. Giai đoạn truyền thông trước thương mại", "level": 3}, {"id": "m28-3", "title": "28.3. Giai đoạn thương mại hóa", "level": 3}, {"id": "m28-4", "title": "28.4. Điều kiện kích hoạt chiến dịch thương mại", "level": 3}]}, {"p": 7, "title": "PHẦN VII. TỔ CHỨC VÀ QUẢN TRỊ PHÒNG TRUYỀN THÔNG", "html": "\n<h2 id=\"m29\">29. Mô hình tổ chức phòng Truyền thông</h2>\n<p>Phòng Truyền thông được tổ chức theo mô hình quản trị tập trung, phục vụ toàn bộ hệ sinh thái Organic Việt Nam và ADIGO.</p>\n<div class=\"visual\"><div class=\"node dark\"><strong>BAN LÃNH ĐẠO</strong><small></small></div><div class=\"connector\">↓</div><div class=\"node dark\"><strong>GIÁM ĐỐC TRUYỀN THÔNG</strong><small>Chiến lược · Quản trị · Điều hành</small></div><div class=\"connector\">↓</div><div class=\"cards two\"><div class=\"tile\"><strong>PR &amp; Corporate Affairs</strong><p>Báo chí · Đối ngoại · Sự kiện</p></div><div class=\"tile\"><strong>Content &amp; Digital</strong><p>Nội dung · Quản trị kênh</p></div><div class=\"tile\"><strong>Brand &amp; Design</strong><p>Thương hiệu · Thiết kế</p></div><div class=\"tile\"><strong>Media Production</strong><p>Quay · Chụp · Dựng phim</p></div></div><div class=\"node\"><strong>PHẠM VI PHỤC VỤ TOÀN HỆ SINH THÁI</strong><small>ORGANIC VIỆT NAM · FARM · FOOD · DISTRIBUTION · ADIGO · ADIGO MART · MARKETPLACE</small></div></div>\n<h3 id=\"m29-1\">29.1. Định biên nhân sự đề xuất</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Vị trí</th>\n<th style=\"text-align:right\">Số lượng</th>\n<th>Trách nhiệm chính</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Giám đốc Truyền thông</td>\n<td style=\"text-align:right\">01</td>\n<td>Chiến lược, thương hiệu, đối ngoại, điều hành, ngân sách</td>\n</tr>\n<tr>\n<td>PR &amp; Event Executive</td>\n<td style=\"text-align:right\">01</td>\n<td>Báo chí, đối ngoại, quan hệ cộng đồng, sự kiện</td>\n</tr>\n<tr>\n<td>Content &amp; Digital Executive</td>\n<td style=\"text-align:right\">01–02</td>\n<td>Nội dung, biên tập, kịch bản, quản trị kênh</td>\n</tr>\n<tr>\n<td>Graphic Designer</td>\n<td style=\"text-align:right\">01</td>\n<td>Nhận diện, thiết kế, bao bì, ấn phẩm</td>\n</tr>\n<tr>\n<td>Multimedia Executive</td>\n<td style=\"text-align:right\">01–02</td>\n<td>Quay phim, chụp ảnh, dựng video</td>\n</tr>\n<tr>\n<td><strong>Tổng cộng</strong></td>\n<td style=\"text-align:right\"><strong>05–07</strong></td>\n<td>Chưa bao gồm nhà cung cấp dịch vụ thuê ngoài</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"m29-2\">29.2. Nguyên tắc phát triển nhân sự</h3>\n<p>Giai đoạn đầu ưu tiên xây dựng đội ngũ có khả năng triển khai đa nhiệm, bảo đảm các chức năng thiết yếu.</p>\n<p>Các dự án sản xuất TVC lớn, phim doanh nghiệp chuyên sâu, sự kiện quy mô lớn, nghiên cứu thương hiệu hoặc dịch vụ chuyên biệt có thể sử dụng nguồn lực thuê ngoài dưới sự quản trị của phòng Truyền thông.</p>\n<h2 id=\"m30\">30. Phân quyền và phối hợp liên phòng ban</h2>\n<h3 id=\"m30-1\">30.1. Phân định chức năng</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Bộ phận</th>\n<th>Vai trò cốt lõi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Truyền thông</td>\n<td>Thương hiệu, danh tiếng, nhận thức, niềm tin và nội dung doanh nghiệp</td>\n</tr>\n<tr>\n<td>Marketing</td>\n<td>Nghiên cứu thị trường, tạo nhu cầu, chiến dịch tiếp thị và chuyển đổi</td>\n</tr>\n<tr>\n<td>Kinh doanh</td>\n<td>Phát triển khách hàng, đại lý, CTV, chốt đơn và doanh thu</td>\n</tr>\n<tr>\n<td>ORGANIC FARM</td>\n<td>Nguồn nguyên liệu, sản xuất và dữ liệu sản xuất</td>\n</tr>\n<tr>\n<td>ORGANIC FOOD, QA</td>\n<td>Phát triển sản phẩm và kiểm soát chất lượng</td>\n</tr>\n<tr>\n<td>ORGANIC DISTRIBUTION</td>\n<td>Chuỗi cung ứng và lưu chuyển hàng hóa</td>\n</tr>\n<tr>\n<td>ADIGO, Công nghệ</td>\n<td>Nền tảng công nghệ, dữ liệu, hệ thống và tính năng</td>\n</tr>\n<tr>\n<td>Hệ thống bán lẻ</td>\n<td>Trải nghiệm mua hàng và dịch vụ trực tiếp</td>\n</tr>\n<tr>\n<td>Nhân sự</td>\n<td>Tổ chức, văn hóa, tuyển dụng và phát triển đội ngũ</td>\n</tr>\n<tr>\n<td>Tài chính</td>\n<td>Ngân sách, chi phí, kiểm soát tài chính</td>\n</tr>\n<tr>\n<td>Pháp chế</td>\n<td>Rà soát pháp lý, hợp đồng, phát ngôn và nội dung có rủi ro</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"m30-2\">30.2. Ma trận trách nhiệm RACI</h3>\n<p><strong>A:</strong> Chịu trách nhiệm cuối cùng; <strong>R:</strong> Trực tiếp thực hiện; <strong>C:</strong> Tham vấn, phối hợp; <strong>I:</strong> Được thông báo.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Hạng mục</th>\n<th>Đơn vị A</th>\n<th>Đơn vị R</th>\n<th>Đơn vị C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Chiến lược truyền thông</td>\n<td>Ban lãnh đạo</td>\n<td>Truyền thông</td>\n<td>Các đơn vị</td>\n</tr>\n<tr>\n<td>Quản trị thương hiệu</td>\n<td>Truyền thông</td>\n<td>Truyền thông</td>\n<td>Marketing, Công nghệ</td>\n</tr>\n<tr>\n<td>Báo chí và đối ngoại</td>\n<td>Truyền thông</td>\n<td>PR &amp; Event</td>\n<td>Lãnh đạo, pháp chế</td>\n</tr>\n<tr>\n<td>Truyền thông sản phẩm</td>\n<td>Truyền thông</td>\n<td>Content, Design, Media</td>\n<td>FOOD, QA, Marketing</td>\n</tr>\n<tr>\n<td>Xác minh thông tin sản xuất</td>\n<td>FARM</td>\n<td>Kỹ thuật sản xuất</td>\n<td>Truyền thông</td>\n</tr>\n<tr>\n<td>Xác minh chất lượng</td>\n<td>QA</td>\n<td>FOOD, QA</td>\n<td>Pháp chế, Truyền thông</td>\n</tr>\n<tr>\n<td>Truyền thông chuỗi cung ứng</td>\n<td>Truyền thông</td>\n<td>Content, Media</td>\n<td>DISTRIBUTION</td>\n</tr>\n<tr>\n<td>Xác minh năng lực giao nhận</td>\n<td>DISTRIBUTION</td>\n<td>Vận hành</td>\n<td>Kinh doanh</td>\n</tr>\n<tr>\n<td>Truyền thông ADIGO</td>\n<td>Truyền thông</td>\n<td>Content, Design, Media</td>\n<td>Công nghệ</td>\n</tr>\n<tr>\n<td>Xác minh tính năng ADIGO</td>\n<td>Công nghệ</td>\n<td>Đội ngũ sản phẩm</td>\n<td>Truyền thông</td>\n</tr>\n<tr>\n<td>Quảng cáo chuyển đổi</td>\n<td>Marketing</td>\n<td>Marketing</td>\n<td>Truyền thông, Kinh doanh</td>\n</tr>\n<tr>\n<td>Chiến dịch bán hàng</td>\n<td>Kinh doanh</td>\n<td>Marketing, Sale</td>\n<td>Truyền thông, Vận hành</td>\n</tr>\n<tr>\n<td>Sự kiện thương hiệu</td>\n<td>Truyền thông</td>\n<td>PR &amp; Event</td>\n<td>Các đơn vị</td>\n</tr>\n<tr>\n<td>Sự kiện thương mại</td>\n<td>Kinh doanh</td>\n<td>Marketing, Sale</td>\n<td>Truyền thông</td>\n</tr>\n<tr>\n<td>Truyền thông nội bộ</td>\n<td>Nhân sự</td>\n<td>Nhân sự, Truyền thông</td>\n<td>Các đơn vị</td>\n</tr>\n<tr>\n<td>Điều phối truyền thông khủng hoảng</td>\n<td>Truyền thông</td>\n<td>Tổ xử lý khủng hoảng</td>\n<td>Chuyên môn, pháp chế</td>\n</tr>\n<tr>\n<td>Xử lý sự cố chuyên môn</td>\n<td>Đơn vị có thẩm quyền</td>\n<td>Bộ phận chuyên môn</td>\n<td>Truyền thông</td>\n</tr>\n</tbody>\n</table></div>\n<p>Ban lãnh đạo giữ quyền phê duyệt ngân sách, chiến lược, phát ngôn và các quyết định quan trọng theo quy chế phân quyền.</p>\n<h3 id=\"m30-3\">30.3. Cơ chế phối hợp thông tin</h3>\n<p>Mỗi cấu phần trong hệ sinh thái cần có đầu mối cung cấp và xác nhận thông tin cho phòng Truyền thông.</p>\n<p>Phòng Truyền thông không tự xác lập số liệu sản xuất, tiêu chuẩn chất lượng, thông tin công nghệ, năng lực giao nhận hoặc chính sách thương mại khi chưa có xác nhận từ đơn vị phụ trách.</p>\n<h2 id=\"m31\">31. Quy trình vận hành truyền thông</h2>\n<div class=\"visual\"><div class=\"steps\"><div class=\"step\"><span class=\"stepnum\">01</span><div><strong>Tiếp nhận yêu cầu</strong></div></div><div class=\"step\"><span class=\"stepnum\">02</span><div><strong>Lập kế hoạch</strong></div></div><div class=\"step\"><span class=\"stepnum\">03</span><div><strong>Thu thập dữ liệu</strong></div></div><div class=\"step\"><span class=\"stepnum\">04</span><div><strong>Xác minh chuyên môn</strong></div></div><div class=\"step\"><span class=\"stepnum\">05</span><div><strong>Sản xuất nội dung</strong></div></div><div class=\"step\"><span class=\"stepnum\">06</span><div><strong>Kiểm duyệt</strong></div></div><div class=\"step\"><span class=\"stepnum\">07</span><div><strong>Phê duyệt</strong></div></div><div class=\"step\"><span class=\"stepnum\">08</span><div><strong>Xuất bản</strong></div></div><div class=\"step\"><span class=\"stepnum\">09</span><div><strong>Đo lường hiệu quả</strong></div></div><div class=\"step\"><span class=\"stepnum\">10</span><div><strong>Lưu trữ &amp; cải tiến</strong></div></div></div></div>\n<p>Nội dung được phân loại theo mức độ rủi ro để xác định cấp phê duyệt. Các nội dung thường xuyên được thực hiện theo kế hoạch đã duyệt; thông tin nhạy cảm, phát ngôn chính thức, thông tin chất lượng và sự cố phải được xác minh và phê duyệt theo thẩm quyền.</p>\n<h2 id=\"m32\">32. Hệ thống tài liệu quản trị bắt buộc</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Mã tài liệu</th>\n<th>Tên tài liệu</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>COM-01</td>\n<td>Chiến lược truyền thông tổng thể</td>\n</tr>\n<tr>\n<td>COM-02</td>\n<td>Kế hoạch truyền thông năm, quý, tháng</td>\n</tr>\n<tr>\n<td>COM-03</td>\n<td>Quy chế tổ chức và hoạt động phòng Truyền thông</td>\n</tr>\n<tr>\n<td>COM-04</td>\n<td>Quy chuẩn kiến trúc và quản trị thương hiệu</td>\n</tr>\n<tr>\n<td>COM-05</td>\n<td>Quy chuẩn thông điệp và thuật ngữ toàn hệ sinh thái</td>\n</tr>\n<tr>\n<td>COM-06</td>\n<td>Quy trình sản xuất, kiểm duyệt và phê duyệt nội dung</td>\n</tr>\n<tr>\n<td>COM-07</td>\n<td>Quy chế phát ngôn và quan hệ báo chí</td>\n</tr>\n<tr>\n<td>COM-08</td>\n<td>Quy trình quản trị danh tiếng và khủng hoảng</td>\n</tr>\n<tr>\n<td>COM-09</td>\n<td>Quy trình tổ chức sự kiện</td>\n</tr>\n<tr>\n<td>COM-10</td>\n<td>Quy trình quản trị tài nguyên truyền thông</td>\n</tr>\n<tr>\n<td>COM-11</td>\n<td>Quy chế phối hợp liên phòng ban</td>\n</tr>\n<tr>\n<td>COM-12</td>\n<td>Quy trình quản lý ngân sách và nhà cung cấp</td>\n</tr>\n<tr>\n<td>COM-13</td>\n<td>Bộ KPI và hệ thống báo cáo</td>\n</tr>\n<tr>\n<td>COM-14</td>\n<td>Quy trình quản trị kênh và tài khoản truyền thông</td>\n</tr>\n<tr>\n<td>COM-15</td>\n<td>Quy trình truyền thông ra mắt sản phẩm và công nghệ</td>\n</tr>\n</tbody>\n</table></div>\n", "headings": [{"id": "m29", "title": "29. Mô hình tổ chức phòng Truyền thông", "level": 2}, {"id": "m29-1", "title": "29.1. Định biên nhân sự đề xuất", "level": 3}, {"id": "m29-2", "title": "29.2. Nguyên tắc phát triển nhân sự", "level": 3}, {"id": "m30", "title": "30. Phân quyền và phối hợp liên phòng ban", "level": 2}, {"id": "m30-1", "title": "30.1. Phân định chức năng", "level": 3}, {"id": "m30-2", "title": "30.2. Ma trận trách nhiệm RACI", "level": 3}, {"id": "m30-3", "title": "30.3. Cơ chế phối hợp thông tin", "level": 3}, {"id": "m31", "title": "31. Quy trình vận hành truyền thông", "level": 2}, {"id": "m32", "title": "32. Hệ thống tài liệu quản trị bắt buộc", "level": 2}]}, {"p": 8, "title": "PHẦN VIII. CHIẾN LƯỢC NGÂN SÁCH TRUYỀN THÔNG 2027", "html": "\n<h2 id=\"m33\">33. Nguyên tắc xây dựng ngân sách</h2>\n<p>Ngân sách truyền thông được xây dựng độc lập với ngân sách Marketing bán hàng nhưng có cơ chế phối hợp trong các chiến dịch tích hợp.</p>\n<p>Ngân sách cần phục vụ ba nhóm mục tiêu: duy trì năng lực vận hành phòng Truyền thông, phát triển tài sản thương hiệu dài hạn và triển khai các chiến dịch trọng điểm.</p>\n<p>Không phân bổ ngân sách đồng đều cho tất cả cấu phần trong hệ sinh thái. Ưu tiên nguồn lực cho các hoạt động đã có năng lực triển khai, có giá trị chiến lược và trực tiếp hỗ trợ mục tiêu kinh doanh năm 2027.</p>\n<h2 id=\"m34\">34. Các phương án ngân sách đề xuất</h2>\n<div class=\"visual\"><div class=\"cards\"><div class=\"tile\"><strong>PHƯƠNG ÁN A · 1,8 tỷ</strong><p>Tinh gọn · 150 triệu/tháng</p></div><div class=\"tile\"><strong>PHƯƠNG ÁN B · 3 tỷ</strong><p>Phát triển · 250 triệu/tháng</p></div><div class=\"tile\"><strong>PHƯƠNG ÁN C · 4,8 tỷ</strong><p>Mở rộng · 400 triệu/tháng</p></div></div></div>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Phương án</th>\n<th>Định hướng triển khai</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A – Tinh gọn</td>\n<td>Tập trung nhân sự cốt lõi, nhận diện, nội dung thực tế và truyền thông sản phẩm</td>\n</tr>\n<tr>\n<td>B – Phát triển</td>\n<td>Phát triển đầy đủ các chức năng truyền thông, báo chí, sự kiện và ADIGO</td>\n</tr>\n<tr>\n<td>C – Mở rộng</td>\n<td>Tăng cường sản xuất nội dung chuyên nghiệp, chiến dịch quy mô lớn và quan hệ truyền thông</td>\n</tr>\n</tbody>\n</table></div>\n<p>Các phương án trên là kịch bản hoạch định ngân sách, chưa phải dự toán chính thức dựa trên báo giá và quỹ lương thực tế.</p>\n<h2 id=\"m35\">35. Cơ cấu phân bổ ngân sách</h2>\n<p>Lấy phương án B với ngân sách 3 tỷ đồng/năm làm cơ sở xây dựng dự toán tham chiếu.</p>\n<div class=\"visual\"><div class=\"budget-widget\"><h4>Mô hình dự toán ngân sách 2027</h4><div class=\"budget-default\"><div class=\"bars\"><div class=\"baritem\"><div><span>Nhân sự phòng Truyền thông</span><strong>35%</strong></div><div class=\"track\"><span style=\"width:35%\"></span></div></div><div class=\"baritem\"><div><span>Sản xuất hình ảnh, video và TVC</span><strong>15%</strong></div><div class=\"track\"><span style=\"width:15%\"></span></div></div><div class=\"baritem\"><div><span>Thương hiệu, thiết kế và ấn phẩm</span><strong>10%</strong></div><div class=\"track\"><span style=\"width:10%\"></span></div></div><div class=\"baritem\"><div><span>Báo chí và quan hệ công chúng</span><strong>10%</strong></div><div class=\"track\"><span style=\"width:10%\"></span></div></div><div class=\"baritem\"><div><span>Sự kiện và trải nghiệm</span><strong>12%</strong></div><div class=\"track\"><span style=\"width:12%\"></span></div></div><div class=\"baritem\"><div><span>Phân phối nội dung truyền thông số</span><strong>10%</strong></div><div class=\"track\"><span style=\"width:10%\"></span></div></div><div class=\"baritem\"><div><span>Công cụ, phần mềm và dữ liệu</span><strong>3%</strong></div><div class=\"track\"><span style=\"width:3%\"></span></div></div><div class=\"baritem\"><div><span>Dự phòng và xử lý phát sinh</span><strong>5%</strong></div><div class=\"track\"><span style=\"width:5%\"></span></div></div></div><p>Ngân sách tham chiếu: 3.000 triệu đồng/năm · 250 triệu đồng/tháng.</p></div><div class=\"budget-interactive\" data-budget=\"\"></div></div></div>\n<p>Ngân sách trên không bao gồm chiết khấu đại lý, hoa hồng CTV, khuyến mãi thương mại, chi phí xây dựng cửa hàng, vận hành chuỗi cung ứng hoặc quảng cáo chuyển đổi thuộc ngân sách Marketing.</p>\n<h2 id=\"m36\">36. Phân bổ ngân sách theo quý</h2>\n<div class=\"visual\"><div class=\"bars\"><div class=\"baritem\"><div><span>Quý I · 1.050 triệu</span><strong>35%</strong></div><div class=\"track\"><span style=\"width:35%\"></span></div></div><div class=\"baritem\"><div><span>Quý II · 660 triệu</span><strong>22%</strong></div><div class=\"track\"><span style=\"width:22%\"></span></div></div><div class=\"baritem\"><div><span>Quý III · 600 triệu</span><strong>20%</strong></div><div class=\"track\"><span style=\"width:20%\"></span></div></div><div class=\"baritem\"><div><span>Quý IV · 690 triệu</span><strong>23%</strong></div><div class=\"track\"><span style=\"width:23%\"></span></div></div></div><p class=\"figcaption\">Minh họa theo phương án ngân sách 3 tỷ đồng/năm.</p></div>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Giai đoạn</th>\n<th style=\"text-align:right\">Tỷ trọng</th>\n<th style=\"text-align:right\">Ngân sách</th>\n<th>Trọng tâm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Quý I</td>\n<td style=\"text-align:right\">35%</td>\n<td style=\"text-align:right\">1.050 triệu</td>\n<td>Nền tảng thương hiệu, sản phẩm gà, chiến dịch Tết</td>\n</tr>\n<tr>\n<td>Quý II</td>\n<td style=\"text-align:right\">22%</td>\n<td style=\"text-align:right\">660 triệu</td>\n<td>Chất lượng, phát triển danh mục và ADIGO</td>\n</tr>\n<tr>\n<td>Quý III</td>\n<td style=\"text-align:right\">20%</td>\n<td style=\"text-align:right\">600 triệu</td>\n<td>Thị trường, đối tác, chuỗi cung ứng, cộng đồng</td>\n</tr>\n<tr>\n<td>Quý IV</td>\n<td style=\"text-align:right\">23%</td>\n<td style=\"text-align:right\">690 triệu</td>\n<td>Hệ sinh thái, sự kiện, danh tiếng và tổng kết</td>\n</tr>\n<tr>\n<td><strong>Tổng cộng</strong></td>\n<td style=\"text-align:right\"><strong>100%</strong></td>\n<td style=\"text-align:right\"><strong>3.000 triệu</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Ngân sách chuẩn bị trong tháng 11–12/2026 cần được xây dựng và phê duyệt riêng, không mặc định tính vào ngân sách hoạt động năm 2027.</p>\n<h2 id=\"m37\">37. Cơ chế quản trị ngân sách</h2>\n<p>Mọi khoản chi truyền thông phải gắn với kế hoạch, dự án hoặc chiến dịch cụ thể. Việc quản lý ngân sách bao gồm lập dự toán, phê duyệt, lựa chọn nhà cung cấp, nghiệm thu, thanh toán và đánh giá hiệu quả.</p>\n<p>Giám đốc Truyền thông chịu trách nhiệm đề xuất phân bổ, theo dõi thực hiện và kiểm soát ngân sách trong phạm vi được phê duyệt.</p>\n<p>Định kỳ hằng quý, cần rà soát hiệu quả đầu tư truyền thông để điều chỉnh nguồn lực giữa các cấu phần theo mức độ sẵn sàng, nhu cầu kinh doanh và kết quả thực tế.</p>\n", "headings": [{"id": "m33", "title": "33. Nguyên tắc xây dựng ngân sách", "level": 2}, {"id": "m34", "title": "34. Các phương án ngân sách đề xuất", "level": 2}, {"id": "m35", "title": "35. Cơ cấu phân bổ ngân sách", "level": 2}, {"id": "m36", "title": "36. Phân bổ ngân sách theo quý", "level": 2}, {"id": "m37", "title": "37. Cơ chế quản trị ngân sách", "level": 2}]}, {"p": 9, "title": "PHẦN IX. HỆ THỐNG KPI VÀ ĐÁNH GIÁ HIỆU QUẢ", "html": "\n<h2 id=\"m38\">38. Khung đánh giá hiệu quả truyền thông</h2>\n<p>Hiệu quả truyền thông được đánh giá thông qua bốn cấp độ, từ kết quả triển khai đến tác động thực tế đối với doanh nghiệp.</p>\n<div class=\"visual\"><div class=\"steps\"><div class=\"step\"><span class=\"stepnum\">01</span><div><strong>OUTPUT – Kết quả triển khai</strong><p>Bài viết, video, sự kiện, ấn phẩm và độ phủ.</p></div></div><div class=\"step\"><span class=\"stepnum\">02</span><div><strong>OUTTAKE – Mức độ tiếp nhận</strong><p>Khách hàng hiểu và ghi nhớ gì về doanh nghiệp.</p></div></div><div class=\"step\"><span class=\"stepnum\">03</span><div><strong>OUTCOME – Thay đổi nhận thức</strong><p>Niềm tin, mức độ ưu tiên lựa chọn và ý định mua.</p></div></div><div class=\"step\"><span class=\"stepnum\">04</span><div><strong>IMPACT – Tác động doanh nghiệp</strong><p>Danh tiếng, phát triển thị trường và quan hệ hợp tác.</p></div></div></div></div>\n<p>Không sử dụng số lượng bài đăng, lượt theo dõi hoặc lượt xem làm tiêu chí duy nhất để đánh giá thành công của truyền thông.</p>\n<h2 id=\"m39\">39. Bộ KPI cấp chiến lược năm 2027</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Nhóm</th>\n<th>Chỉ tiêu</th>\n<th style=\"text-align:right\">Mục tiêu đề xuất</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Thương hiệu</td>\n<td>Nhận biết có hỗ trợ tại thị trường trọng điểm</td>\n<td style=\"text-align:right\">≥ 50%</td>\n</tr>\n<tr>\n<td>Thương hiệu</td>\n<td>Mức độ tin tưởng trong nhóm biết thương hiệu</td>\n<td style=\"text-align:right\">≥ 70%</td>\n</tr>\n<tr>\n<td>Nhận thức</td>\n<td>Hiểu đúng mô hình sản xuất trong nhóm đã tiếp cận</td>\n<td style=\"text-align:right\">≥ 70%</td>\n</tr>\n<tr>\n<td>Nhận diện</td>\n<td>Tuân thủ quy chuẩn thương hiệu</td>\n<td style=\"text-align:right\">100%</td>\n</tr>\n<tr>\n<td>Website</td>\n<td>Lượt truy cập trong năm</td>\n<td style=\"text-align:right\">100.000</td>\n</tr>\n<tr>\n<td>Digital</td>\n<td>Tổng lượt tiếp cận nội dung</td>\n<td style=\"text-align:right\">5 triệu</td>\n</tr>\n<tr>\n<td>Digital</td>\n<td>Tổng lượt xem video</td>\n<td style=\"text-align:right\">2 triệu</td>\n</tr>\n<tr>\n<td>Facebook</td>\n<td>Người theo dõi phù hợp thị trường mục tiêu</td>\n<td style=\"text-align:right\">20.000</td>\n</tr>\n<tr>\n<td>Báo chí</td>\n<td>Bài viết, phóng sự phù hợp định vị</td>\n<td style=\"text-align:right\">20–30</td>\n</tr>\n<tr>\n<td>Nội dung</td>\n<td>Bài viết truyền thông gốc</td>\n<td style=\"text-align:right\">250–350</td>\n</tr>\n<tr>\n<td>Multimedia</td>\n<td>Video ngắn</td>\n<td style=\"text-align:right\">150–200</td>\n</tr>\n<tr>\n<td>Multimedia</td>\n<td>Video chuyên sâu</td>\n<td style=\"text-align:right\">12–24</td>\n</tr>\n<tr>\n<td>Thương hiệu</td>\n<td>Phim giới thiệu doanh nghiệp</td>\n<td style=\"text-align:right\">1–2</td>\n</tr>\n<tr>\n<td>Sự kiện</td>\n<td>Hoạt động tham quan, trải nghiệm</td>\n<td style=\"text-align:right\">8–12</td>\n</tr>\n<tr>\n<td>Đối ngoại</td>\n<td>Đầu mối đối tác tiềm năng được xác minh</td>\n<td style=\"text-align:right\">100</td>\n</tr>\n<tr>\n<td>ADIGO</td>\n<td>Chiến dịch giới thiệu năng lực công nghệ</td>\n<td style=\"text-align:right\">2–4</td>\n</tr>\n<tr>\n<td>Nội bộ</td>\n<td>Nhân viên được phổ biến thông điệp</td>\n<td style=\"text-align:right\">100%</td>\n</tr>\n<tr>\n<td>Vận hành</td>\n<td>Hoàn thành nhiệm vụ đúng tiến độ</td>\n<td style=\"text-align:right\">≥ 95%</td>\n</tr>\n<tr>\n<td>Kiểm duyệt</td>\n<td>Nội dung thuộc diện bắt buộc được xác minh</td>\n<td style=\"text-align:right\">100%</td>\n</tr>\n<tr>\n<td>Khủng hoảng</td>\n<td>Tiếp nhận và báo cáo sự cố nghiêm trọng</td>\n<td style=\"text-align:right\">Trong 60 phút</td>\n</tr>\n<tr>\n<td>Tài chính</td>\n<td>Chi phí thực hiện</td>\n<td style=\"text-align:right\">Trong ngân sách được duyệt</td>\n</tr>\n</tbody>\n</table></div>\n<p>Các mục tiêu trên là chỉ tiêu đề xuất để xây dựng kế hoạch. Phòng Truyền thông cần thực hiện khảo sát ban đầu, xác lập dữ liệu nền và thống nhất cách tính trước khi Ban lãnh đạo giao KPI chính thức.</p>\n<p>Lượt tiếp cận trên nhiều nền tảng không được mặc định là số người duy nhất. Nội dung đăng lại cần được phân biệt với nội dung sản xuất mới.</p>\n<h2 id=\"m40\">40. KPI theo cấu phần hệ sinh thái</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Cấu phần</th>\n<th>Nhóm chỉ số đánh giá</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ORGANIC VIỆT NAM</td>\n<td>Nhận biết thương hiệu, uy tín, chất lượng báo chí, quan hệ đối tác</td>\n</tr>\n<tr>\n<td>ORGANIC FARM</td>\n<td>Mức độ hiểu nguồn sản xuất, mô hình thảo dược, niềm tin về nguồn gốc</td>\n</tr>\n<tr>\n<td>ORGANIC FOOD</td>\n<td>Mức độ hiểu sản phẩm, chất lượng cảm nhận, ý định mua</td>\n</tr>\n<tr>\n<td>ORGANIC DISTRIBUTION</td>\n<td>Mức độ hiểu năng lực cung ứng, niềm tin vào bảo quản và giao nhận</td>\n</tr>\n<tr>\n<td>ADIGO</td>\n<td>Nhận biết công nghệ, hiểu năng lực nền tảng, mức độ quan tâm sử dụng</td>\n</tr>\n<tr>\n<td>ADIGO MART</td>\n<td>Nhận biết điểm bán, trải nghiệm và phản hồi khách hàng</td>\n</tr>\n<tr>\n<td>ADIGO MARKETPLACE</td>\n<td>Mức độ quan tâm của nhà cung cấp, nhà bán hàng và đối tác</td>\n</tr>\n</tbody>\n</table></div>\n<p>KPI đối với các cấu phần chưa vận hành thương mại được đánh giá theo mức độ hoàn thiện nền tảng truyền thông và khả năng chuẩn bị ra mắt, không áp đặt chỉ tiêu người dùng hoặc doanh thu.</p>\n<h2 id=\"m41\">41. KPI Giám đốc Truyền thông</h2>\n<div class=\"visual\"><div class=\"bars\"><div class=\"baritem\"><div><span>Giá trị thương hiệu và danh tiếng</span><strong>25%</strong></div><div class=\"track\"><span style=\"width:25%\"></span></div></div><div class=\"baritem\"><div><span>Truyền thông sản phẩm, hỗ trợ kinh doanh</span><strong>25%</strong></div><div class=\"track\"><span style=\"width:25%\"></span></div></div><div class=\"baritem\"><div><span>Báo chí, đối ngoại và sự kiện</span><strong>15%</strong></div><div class=\"track\"><span style=\"width:15%\"></span></div></div><div class=\"baritem\"><div><span>Nội dung, sáng tạo và truyền thông số</span><strong>15%</strong></div><div class=\"track\"><span style=\"width:15%\"></span></div></div><div class=\"baritem\"><div><span>Quản trị nhân sự, tiến độ và ngân sách</span><strong>10%</strong></div><div class=\"track\"><span style=\"width:10%\"></span></div></div><div class=\"baritem\"><div><span>Truyền thông nội bộ và kiểm soát rủi ro</span><strong>10%</strong></div><div class=\"track\"><span style=\"width:10%\"></span></div></div></div></div>\n<p>Nhóm KPI hỗ trợ kinh doanh được đánh giá thông qua mức độ đóng góp của truyền thông vào nhận biết sản phẩm, tiếp nhận nhu cầu, hỗ trợ hệ thống bán hàng và phát triển niềm tin khách hàng. Doanh thu và tỷ lệ chốt đơn là chỉ tiêu phối hợp với Marketing và Kinh doanh, không phải trách nhiệm độc lập của phòng Truyền thông.</p>\n<h2 id=\"m42\">42. Hệ thống báo cáo quản trị</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Báo cáo</th>\n<th>Tần suất</th>\n<th>Đối tượng nhận</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Báo cáo công việc và tiến độ</td>\n<td>Hằng tuần</td>\n<td>Giám đốc Truyền thông</td>\n</tr>\n<tr>\n<td>Báo cáo nội dung và kênh</td>\n<td>Hằng tuần</td>\n<td>Giám đốc Truyền thông</td>\n</tr>\n<tr>\n<td>Báo cáo KPI và ngân sách</td>\n<td>Hằng tháng</td>\n<td>Ban lãnh đạo</td>\n</tr>\n<tr>\n<td>Báo cáo phối hợp thương mại</td>\n<td>Theo chiến dịch</td>\n<td>Marketing, Kinh doanh, lãnh đạo</td>\n</tr>\n<tr>\n<td>Báo cáo báo chí và dư luận</td>\n<td>Hằng tuần/khi phát sinh</td>\n<td>Giám đốc Truyền thông</td>\n</tr>\n<tr>\n<td>Báo cáo hiệu quả chiến dịch</td>\n<td>Sau mỗi chiến dịch</td>\n<td>Ban lãnh đạo và đơn vị phối hợp</td>\n</tr>\n<tr>\n<td>Báo cáo thương hiệu và danh tiếng</td>\n<td>Hằng quý</td>\n<td>Ban lãnh đạo</td>\n</tr>\n<tr>\n<td>Báo cáo rủi ro truyền thông</td>\n<td>Khi phát sinh</td>\n<td>Ban lãnh đạo</td>\n</tr>\n<tr>\n<td>Báo cáo tổng kết năm</td>\n<td>Cuối năm</td>\n<td>Ban lãnh đạo</td>\n</tr>\n</tbody>\n</table></div>\n<p>Hệ thống báo cáo cần được tổ chức tập trung thông qua Dashboard quản trị, liên kết dữ liệu công việc, nội dung, ngân sách, chiến dịch, KPI và các vấn đề cần xử lý.</p>\n", "headings": [{"id": "m38", "title": "38. Khung đánh giá hiệu quả truyền thông", "level": 2}, {"id": "m39", "title": "39. Bộ KPI cấp chiến lược năm 2027", "level": 2}, {"id": "m40", "title": "40. KPI theo cấu phần hệ sinh thái", "level": 2}, {"id": "m41", "title": "41. KPI Giám đốc Truyền thông", "level": 2}, {"id": "m42", "title": "42. Hệ thống báo cáo quản trị", "level": 2}]}, {"p": 10, "title": "PHẦN X. DANH MỤC DỰ ÁN TRUYỀN THÔNG TRỌNG ĐIỂM", "html": "\n<h2 id=\"m43\">43. Master Project Portfolio 2027</h2>\n<p>Danh mục dự án được tổ chức thành sáu nhóm, bao phủ toàn bộ chức năng của phòng Truyền thông và kiến trúc hệ sinh thái Organic Việt Nam.</p>\n<p>Quy ước mức độ ưu tiên:</p>\n<ul>\n<li><strong>P1:</strong> Cấp thiết, cần hoàn thành để phục vụ nền tảng vận hành hoặc thương mại.</li>\n<li><strong>P2:</strong> Quan trọng, triển khai trong năm theo tiến độ phát triển.</li>\n<li><strong>P3:</strong> Triển khai khi cấu phần và điều kiện thực tế đã sẵn sàng.</li>\n</ul>\n<h3>Nhóm A. Chiến lược và quản trị</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Mã</th>\n<th>Dự án</th>\n<th style=\"text-align:center\">Ưu tiên</th>\n<th>Tiến độ</th>\n</tr>\n</thead>\n<tbody>\n<tr id=\"project-A01\">\n<td>A01</td>\n<td>Chiến lược truyền thông tổng thể 2027</td>\n<td style=\"text-align:center\">P1</td>\n<td>12/2026</td>\n</tr>\n<tr id=\"project-A02\">\n<td>A02</td>\n<td>Đề án tổ chức và vận hành phòng Truyền thông</td>\n<td style=\"text-align:center\">P1</td>\n<td>12/2026</td>\n</tr>\n<tr id=\"project-A03\">\n<td>A03</td>\n<td>Tuyển dụng và hoàn thiện định biên nhân sự</td>\n<td style=\"text-align:center\">P1</td>\n<td>Q1</td>\n</tr>\n<tr id=\"project-A04\">\n<td>A04</td>\n<td>Hệ thống quy trình và quy chế quản trị</td>\n<td style=\"text-align:center\">P1</td>\n<td>Q1</td>\n</tr>\n<tr id=\"project-A05\">\n<td>A05</td>\n<td>Ngân sách và Dashboard KPI</td>\n<td style=\"text-align:center\">P1</td>\n<td>Q1</td>\n</tr>\n<tr id=\"project-A06\">\n<td>A06</td>\n<td>Hệ thống quản trị tài nguyên truyền thông</td>\n<td style=\"text-align:center\">P1</td>\n<td>Q1</td>\n</tr>\n<tr id=\"project-A07\">\n<td>A07</td>\n<td>Quy chuẩn thông điệp toàn hệ sinh thái</td>\n<td style=\"text-align:center\">P1</td>\n<td>12/2026</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Nhóm B. Thương hiệu và nhận diện</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Mã</th>\n<th>Dự án</th>\n >Đối ngoại</small></span></label><label class=\"checkrow\"><input data-task=\"17\" type=\"checkbox\"/><span><strong>18. Lập kế hoạch ra mắt sản phẩm gà</strong><small>Chiến dịch</small></span></label><label class=\"checkrow\"><input data-task=\"18\" type=\"checkbox\"/><span><strong>19. Xây dựng quy trình xử lý khủng hoảng</strong><small>Danh tiếng</small></span></label><label class=\"checkrow\"><input data-task=\"19\" type=\"checkbox\"/><span><strong>20. Hoàn thiện Master Project Tracker và Dashboard KPI</strong><small>Quản trị</small></span></label><button class=\"btn\" data-copytasks=\"\">Sao chép danh sách công việc</button></div></div>\n", "headings": [{"id": "m43", "title": "43. Master Project Portfolio 2027", "level": 2}, {"id": "m44", "title": "44. Danh mục công việc ưu tiên triển khai ngay", "level": 2}]}, {"p": 11, "title": "PHẦN XI. TRỌNG TÂM ĐIỀU HÀNH CỦA GIÁM ĐỐC TRUYỀN THÔNG", "html": "\n<h2 id=\"m45\">45. Vai trò và trách nhiệm điều hành</h2>\n<p>Giám đốc Truyền thông chịu trách nhiệm xây dựng, tổ chức triển khai và kiểm soát toàn bộ chiến lược truyền thông của Organic Việt Nam và ADIGO.</p>\n<p>Vai trò không giới hạn trong việc quản lý nội dung, thiết kế hoặc sản xuất video mà bao gồm quản trị chiến lược, thương hiệu, danh tiếng, quan hệ đối ngoại, ngân sách, nhân sự và hiệu quả truyền thông toàn hệ sinh thái.</p>\n<h3>Phạm vi trách nhiệm trực tiếp</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Nhóm nhiệm vụ</th>\n<th>Trách nhiệm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Chiến lược</td>\n<td>Xây dựng định hướng, kế hoạch và mục tiêu truyền thông</td>\n</tr>\n<tr>\n<td>Thương hiệu</td>\n<td>Quản trị kiến trúc, định vị, nhận diện và thông điệp</td>\n</tr>\n<tr>\n<td>Điều hành</td>\n<td>Phân công, kiểm soát tiến độ và chất lượng</td>\n</tr>\n<tr>\n<td>Đối ngoại</td>\n<td>Quan hệ báo chí, đối tác, cộng đồng</td>\n</tr>\n<tr>\n<td>Danh tiếng</td>\n<td>Giám sát thông tin, quản trị và xử lý khủng hoảng</td>\n</tr>\n<tr>\n<td>Tài chính</td>\n<td>Lập và kiểm soát ngân sách</td>\n</tr>\n<tr>\n<td>Nhân sự</td>\n<td>Xây dựng tổ chức, tuyển dụng và phát triển năng lực</td>\n</tr>\n<tr>\n<td>Phối hợp</td>\n<td>Kết nối Marketing, Kinh doanh và các cấu phần hệ sinh thái</td>\n</tr>\n<tr>\n<td>Đánh giá</td>\n<td>KPI, báo cáo, phân tích và cải tiến</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"m46\">46. Phân bổ thời gian quản trị</h2>\n<div class=\"visual\"><div class=\"bars\"><div class=\"baritem\"><div><span>Chiến lược, kế hoạch và điều hành</span><strong>30%</strong></div><div class=\"track\"><span style=\"width:30%\"></span></div></div><div class=\"baritem\"><div><span>Báo chí, đối ngoại và quan hệ cấp cao</span><strong>25%</strong></div><div class=\"track\"><span style=\"width:25%\"></span></div></div><div class=\"baritem\"><div><span>Quản trị thương hiệu và chiến dịch</span><strong>20%</strong></div><div class=\"track\"><span style=\"width:20%\"></span></div></div><div class=\"baritem\"><div><span>Phối hợp liên phòng ban và hệ sinh thái</span><strong>15%</strong></div><div class=\"track\"><span style=\"width:15%\"></span></div></div><div class=\"baritem\"><div><span>Kiểm duyệt, đánh giá và báo cáo</span><strong>10%</strong></div><div class=\"track\"><span style=\"width:10%\"></span></div></div></div></div>\n<p>Giám đốc Truyền thông không nên sử dụng phần lớn thời gian để trực tiếp thực hiện các công việc tác nghiệp như viết bài, thiết kế, quay phim hoặc dựng video. Các nhiệm vụ đó cần được giao cho đội ngũ chuyên môn, dưới sự định hướng và kiểm soát chất lượng của Giám đốc.</p>\n<h2 id=\"m47\">47. Cơ chế điều hành định kỳ</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Tần suất</th>\n<th>Nội dung điều hành</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hằng ngày</td>\n<td>Giám sát thông tin, phê duyệt nội dung, xử lý phát sinh</td>\n</tr>\n<tr>\n<td>Thứ Hai</td>\n<td>Họp phòng, phân công và kiểm tra kế hoạch tuần</td>\n</tr>\n<tr>\n<td>Thứ Ba</td>\n<td>Phối hợp Marketing, Kinh doanh, FARM, FOOD, DISTRIBUTION, ADIGO</td>\n</tr>\n<tr>\n<td>Thứ Tư</td>\n<td>Kiểm tra tiến độ sản xuất nội dung và các dự án</td>\n</tr>\n<tr>\n<td>Thứ Năm</td>\n<td>Quan hệ báo chí, đối ngoại, đối tác và sự kiện</td>\n</tr>\n<tr>\n<td>Thứ Sáu</td>\n<td>Đánh giá KPI, ngân sách, tiến độ và báo cáo</td>\n</tr>\n<tr>\n<td>Hằng tháng</td>\n<td>Rà soát chiến dịch, nguồn lực và hiệu quả</td>\n</tr>\n<tr>\n<td>Hằng quý</td>\n<td>Đánh giá thương hiệu, danh tiếng và điều chỉnh chiến lược</td>\n</tr>\n<tr>\n<td>Hằng năm</td>\n<td>Tổng kết, hoạch định chiến lược và ngân sách năm tiếp theo</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"m48\">48. Các nội dung trình Ban lãnh đạo phê duyệt</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:right\">STT</th>\n<th>Nội dung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:right\">01</td>\n<td>Chiến lược truyền thông tổng thể 2027</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">02</td>\n<td>Kiến trúc hệ sinh thái và quản trị thương hiệu</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">03</td>\n<td>Định vị, thông điệp và quy chuẩn thuật ngữ</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">04</td>\n<td>Cơ cấu tổ chức và định biên phòng Truyền thông</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">05</td>\n<td>Chức năng, nhiệm vụ và quyền hạn Giám đốc Truyền thông</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">06</td>\n<td>Ngân sách hoạt động năm 2027</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">07</td>\n<td>Danh mục dự án và chiến dịch trọng điểm</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">08</td>\n<td>Cơ chế phối hợp giữa các phòng ban và cấu phần</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">09</td>\n<td>Hệ thống KPI và báo cáo quản trị</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">10</td>\n<td>Kế hoạch triển khai 90 ngày đầu tiên</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">11</td>\n<td>Quy chế phát ngôn và quản trị khủng hoảng</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">12</td>\n<td>Lộ trình phát triển truyền thông ADIGO, bán lẻ và Marketplace</td>\n</tr>\n</tbody>\n</table></div>\n", "headings": [{"id": "m45", "title": "45. Vai trò và trách nhiệm điều hành", "level": 2}, {"id": "m46", "title": "46. Phân bổ thời gian quản trị", "level": 2}, {"id": "m47", "title": "47. Cơ chế điều hành định kỳ", "level": 2}, {"id": "m48", "title": "48. Các nội dung trình Ban lãnh đạo phê duyệt", "level": 2}]}, {"p": 12, "title": "PHẦN XII. TỔNG KẾT MÔ HÌNH CHIẾN LƯỢC", "html": "\n<h2 id=\"m49\">49. Sơ đồ chiến lược truyền thông tổng thể 2027</h2>\n<div class=\"visual\"><div class=\"node dark\"><strong>CHIẾN LƯỢC TRUYỀN THÔNG 2027</strong><small>ORGANIC VIỆT NAM &amp; ADIGO</small></div><h4>NỀN TẢNG PHÁT TRIỂN</h4><div class=\"cards\"><div class=\"tile\"><strong>NÔNG NGHIỆP</strong><p>Phát triển năng lực sản xuất và nguồn nguyên liệu.</p></div><div class=\"tile\"><strong>THỰC PHẨM</strong><p>Phát triển sản phẩm, chất lượng và giá trị gia tăng.</p></div><div class=\"tile\"><strong>CÔNG NGHỆ</strong><p>Quản trị, kết nối dữ liệu, thương mại và thị trường.</p></div></div><h4>KIẾN TRÚC HỆ SINH THÁI</h4><div class=\"chain\"><div class=\"node\"><strong>FARM</strong><small>Nguyên liệu</small></div><div class=\"node\"><strong>FOOD</strong><small>Sản phẩm</small></div><div class=\"node\"><strong>DISTRIBUTION</strong><small>Lưu chuyển</small></div><div class=\"node blue\"><strong>ADIGO</strong><small>Thương mại</small></div><div class=\"node\"><strong>CUSTOMER</strong><small>Giá trị</small></div></div><div class=\"node lightblue\"><strong>ADIGO – HẠ TẦNG CÔNG NGHỆ XUYÊN SUỐT</strong><small>Quản trị · Dữ liệu · Truy xuất · Kết nối</small></div><div class=\"feedback\">↶ Dữ liệu · Nhu cầu · Phản hồi khách hàng<br/><strong>TỪ NÔNG NGHIỆP ĐẾN BÀN ĂN</strong></div><div class=\"cards two\"><div class=\"tile\"><strong>ADIGO MART</strong><p>Bán lẻ</p></div><div class=\"tile\"><strong>ADIGO MARKETPLACE</strong><p>Thương mại số</p></div></div><h4>10 TRỤ CỘT TRUYỀN THÔNG</h4><div class=\"pillars\"><a class=\"pillar\" href=\"#p4/m12\"><span>01</span><strong>Quản trị thương hiệu</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m13\"><span>02</span><strong>Truyền thông doanh nghiệp</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m14\"><span>03</span><strong>Sản phẩm &amp; chuỗi giá trị</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m15\"><span>04</span><strong>Truyền thông ADIGO</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m16\"><span>05</span><strong>Báo chí &amp; quan hệ công chúng</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m17\"><span>06</span><strong>Truyền thông lãnh đạo</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m18\"><span>07</span><strong>Truyền thông số</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m19\"><span>08</span><strong>Sự kiện &amp; trải nghiệm</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m20\"><span>09</span><strong>Cộng đồng &amp; nội bộ</strong><b>↗</b></a><a class=\"pillar\" href=\"#p4/m21\"><span>10</span><strong>Danh tiếng &amp; khủng hoảng</strong><b>↗</b></a></div><div class=\"node\"><strong>TỔ CHỨC – NHÂN SỰ – NGÂN SÁCH – KPI</strong><small>Hệ thống quản trị và thực thi</small></div><div class=\"node dark\"><strong>CUSTOMER</strong><small>Khách hàng · Người tiêu dùng · Đối tác</small></div><div class=\"cards\"><div class=\"tile\"><strong>THƯƠNG HIỆU</strong><p>Nhận biết</p></div><div class=\"tile\"><strong>NIỀM TIN</strong><p>Danh tiếng</p></div><div class=\"tile\"><strong>THỊ TRƯỜNG</strong><p>Phát triển</p></div></div><div class=\"node\"><strong>TÍCH LŨY GIÁ TRỊ – PHÁT TRIỂN BỀN VỮNG</strong><small></small></div><p class=\"figcaption\">Sơ đồ tổng thể liên kết chiến lược kinh doanh, kiến trúc hệ sinh thái và hệ thống truyền thông Organic Việt Nam năm 2027.</p></div>\n<h2 id=\"m50\">50. Kết luận chiến lược</h2>\n<p>Chiến lược truyền thông tổng thể 2027 được xây dựng trên cơ sở định hướng phát triển Organic Việt Nam thành hệ sinh thái kinh doanh tích hợp giữa nông nghiệp, thực phẩm, chuỗi cung ứng, công nghệ và thương mại.</p>\n<p>Trong đó:</p>\n<p><strong>ORGANIC FARM</strong> tạo nền tảng sản xuất nông nghiệp và nguồn nguyên liệu.</p>\n<p><strong>ORGANIC FOOD</strong> phát triển sản phẩm và tạo giá trị gia tăng từ thực phẩm.</p>\n<p><strong>ORGANIC DISTRIBUTION</strong> phát triển năng lực tổ chức chuỗi cung ứng, bảo quản, vận chuyển và phân phối.</p>\n<p><strong>ADIGO</strong> phát triển nền tảng công nghệ quản trị, kết nối dữ liệu và tổ chức hoạt động thương mại.</p>\n<p><strong>ADIGO MART</strong> phát triển hệ thống bán lẻ trực tiếp và trải nghiệm khách hàng.</p>\n<p><strong>ADIGO MARKETPLACE</strong> mở rộng khả năng kết nối nguồn cung, đối tác kinh doanh và thị trường.</p>\n<p>Toàn bộ hệ sinh thái được quản trị dưới định hướng chiến lược chung của Organic Việt Nam, lấy chất lượng sản phẩm và giá trị khách hàng làm trọng tâm.</p>\n<p>Trên nền tảng đó, phòng Truyền thông có trách nhiệm xây dựng một hệ thống thông tin và thương hiệu nhất quán, giúp thị trường nhận biết đúng, hiểu đúng và tin tưởng vào những giá trị mà doanh nghiệp đang tạo dựng.</p>\n<p>Năm 2027 không chỉ là năm giới thiệu sản phẩm ra thị trường mà còn là năm xây dựng nền móng thương hiệu, danh tiếng, năng lực truyền thông và quan hệ đối tác cho quá trình phát triển dài hạn.</p>\n<div class=\"visual\"><div class=\"messagecards\"><div class=\"tile\"><strong>ĐỊNH VỊ THƯƠNG HIỆU</strong><p>Kiến tạo hệ sinh thái giá trị · Nông nghiệp · Thực phẩm · Công nghệ</p></div><div class=\"tile\"><strong>CÔNG THỨC CHIẾN LƯỢC</strong><p>FARM → FOOD → DISTRIBUTION → ADIGO → CUSTOMER</p></div><div class=\"tile\"><strong>ĐỊNH HƯỚNG TRUYỀN THÔNG 2027</strong><p>Xây dựng thương hiệu. Tạo dựng niềm tin. Phát triển thị trường.</p></div><div class=\"tile\"><strong>GIÁ TRỊ PHÁT TRIỂN DÀI HẠN</strong><p>Chất lượng sản phẩm – Giá trị khách hàng – Năng lực hệ sinh thái.</p></div></div></div>\n", "headings": [{"id": "m49", "title": "49. Sơ đồ chiến lược truyền thông tổng thể 2027", "level": 2}, {"id": "m50", "title": "50. Kết luận chiến lược", "level": 2}]}, {"p": 13, "title": "PHỤ LỤC. HỆ THỐNG TÀI LIỆU TRIỂN KHAI SAU CHIẾN LƯỢC", "html": "\n<p>Sau khi chiến lược tổng thể được phê duyệt, Giám đốc Truyền thông chịu trách nhiệm cụ thể hóa thành các tài liệu quản trị và kế hoạch tác nghiệp.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:right\">STT</th>\n<th>Tài liệu</th>\n<th>Mục đích</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:right\">01</td>\n<td>Chiến lược truyền thông tổng thể 2027</td>\n<td>Định hướng cấp doanh nghiệp</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">02</td>\n<td>Kế hoạch hành động truyền thông 2027</td>\n<td>Chi tiết tháng, quý, chiến dịch, deadline</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">03</td>\n<td>Kế hoạch truyền thông sản phẩm gà – Tết 2027</td>\n<td>Triển khai mục tiêu thương mại cấp thiết</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">04</td>\n<td>Đề án tổ chức và vận hành phòng Truyền thông</td>\n<td>Nhân sự, cơ cấu, chức năng, phân quyền</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">05</td>\n<td>Dự toán ngân sách truyền thông 2027</td>\n<td>Phân bổ nguồn lực và kiểm soát tài chính</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">06</td>\n<td>Brand Guidelines – Organic Việt Nam &amp; ADIGO</td>\n<td>Chuẩn hóa nhận diện toàn hệ sinh thái</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">07</td>\n<td>Corporate Messaging Guidelines</td>\n<td>Chuẩn hóa thông điệp và thuật ngữ</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">08</td>\n<td>Kế hoạch PR, báo chí và sự kiện 2027</td>\n<td>Phát triển đối ngoại và danh tiếng</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">09</td>\n<td>Kế hoạch truyền thông ADIGO</td>\n<td>Phát triển thương hiệu công nghệ và thương mại</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">10</td>\n<td>Master Content Plan 2027</td>\n<td>Quản trị hệ thống nội dung và sáng tạo</td>\n</tr>\n<tr>\n<td style=\"text-align:right\">11</td>\n<td
