function bindTasks(){$$('[data-task]').forEach(el=>{el.checked=!!state.tasks[el.dataset.task];el.onchange=()=>{state.tasks[el.dataset.task]=el.checked;save();updateTasks()}});$$('[data-copytasks]').forEach(b=>b.onclick=()=>copyText($$('[data-task]').map(el=>`${el.checked?'[x]':'[ ]'} ${el.nextElementSibling.innerText.replace(/\n/g,' – ')}`).join('\n')));updateTasks()}
function updateTasks(){let n=Object.values(state.tasks).filter(Boolean).length;$$('[data-checkcount]').forEach(e=>e.textContent=n+'/20');$$('[data-checkbar]').forEach(e=>e.style.width=(n*5)+'%')}
function bindBudget(){$$('[data-budget]').forEach(el=>{el.innerHTML=`<div class="notice">Mô phỏng tương tác — thay đổi không sửa nội dung và số liệu tham chiếu của chiến lược gốc.</div><div class="budget-controls"><label class="field">Tổng ngân sách năm (triệu đồng)<input type="number" data-budget-total min="0" step="100" value="${esc(state.budget)}"></label>${[1800,3000,4800].map(v=>`<button class="btn small" data-scenario="${v}">${fmt(v/1000)} tỷ</button>`).join('')}<button class="btn small" data-resetbudget>Về mặc định</button></div><div>${data.budgetnames.map((n,i)=>`<div class="budget-row"><label for="weight-${i}">${esc(n)}</label><input type="range" data-range="${i}" aria-label="Tỷ trọng ${esc(n)}" min="0" max="60" step="1" value="${state.weights[i]}"><input id="weight-${i}" type="number" data-weight="${i}" aria-label="Phần trăm ${esc(n)}" min="0" max="60" value="${state.weights[i]}"><span class="money" data-money="${i}"></span></div>`).join('')}</div><div class="budget-total" data-summary></div><button class="btn" data-copybudget>Sao chép dự toán</button> <button class="btn" data-exportbudget>Xuất CSV</button>`;function refresh(){let total=state.weights.reduce((a,b)=>a+Number(b),0),amount=Number(state.budget)||0;$$('[data-money]',el).forEach((e,i)=>e.textContent=fmt(amount*state.weights[i]/100)+' tr');let s=$('[data-summary]',el);s.classList.toggle('warn',total!==100);s.innerHTML=`<span>Tổng tỷ trọng <strong>${total}%</strong></span><span>Đã phân bổ <strong>${fmt(amount*total/100)} tr/năm</strong></span><span>Bình quân <strong>${fmt(amount*total/1200)} tr/tháng</strong></span>${total!==100?'<small>Cần điều chỉnh tổng tỷ trọng về 100%.</small>':''}`;$$('[data-scenario]',el).forEach(b=>b.classList.toggle('primary',Number(b.dataset.scenario)===amount))}function update(i,v){state.weights[i]=Math.min(60,Math.max(0,Math.round(Number(v)||0)));$(`[data-range="${i}"]`,el).value=state.weights[i];$(`[data-weight="${i}"]`,el).value=state.weights[i];save();refresh()}$('[data-budget-total]',el).oninput=e=>{state.budget=Math.max(0,Number(e.target.value)||0);save();refresh()};$$('[data-range]',el).forEach(e=>e.oninput=()=>update(Number(e.dataset.range),e.value));$$('[data-weight]',el).forEach(e=>e.oninput=()=>update(Number(e.dataset.weight),e.value));$$('[data-scenario]',el).forEach(b=>b.onclick=()=>{state.budget=Number(b.dataset.scenario);$('[data-budget-total]',el).value=state.budget;save();refresh()});$('[data-resetbudget]',el).onclick=()=>{state.budget=3000;state.weights=[...data.weights];save();bindBudget()};$('[data-copybudget]',el).onclick=()=>copyText('DỰ TOÁN NGÂN SÁCH TRUYỀN THÔNG 2027\nTổng ngân sách: '+fmt(state.budget)+' triệu đồng\n'+data.budgetnames.map((n,i)=>`${n}: ${state.weights[i]}% – ${fmt(state.budget*state.weights[i]/100)} triệu đồng`).join('\n')+'\nTổng tỷ trọng: '+state.weights.reduce((a,b)=>a+b,0)+'%');$('[data-exportbudget]',el).onclick=()=>exportFile('OrganicVN-Ngan-sach-2027.csv',csv([['Hạng mục','Tỷ trọng (%)','Ngân sách (triệu đồng)'],...data.budgetnames.map((n,i)=>[n,state.weights[i],state.budget*state.weights[i]/100])]),'text/csv;charset=utf-8');refresh()})}
const getProject=id=>state.projects[id]||{status:statuses[0],owner:'',note:''};
function stats(){let counts=Object.fromEntries(statuses.map(s=>[s,0]));data.projects.forEach(p=>{let s=getProject(p.id).status||statuses[0];counts[s]=(counts[s]||0)+1});return counts}
function updateDash(){let el=$('#dash-progress');if(!el)return;let c=stats(),done=c['Hoàn thành']||0,tc=Object.values(state.tasks).filter(Boolean).length;el.innerHTML=`<div class="progresssummary"><div class="tile"><strong>${done}/57</strong><small>Dự án hoàn thành</small></div><div class="tile"><strong>${c['Đang thực hiện']||0}</strong><small>Đang thực hiện</small></div><div class="tile"><strong>${tc}/20</strong><small>Nhiệm vụ cấp thiết</small></div></div><div class="track"><span style="width:${done/57*100}%"></span></div><p class="muted" style="margin-top:8px">${c['Chưa cập nhật']||0} dự án chưa có trạng thái được nhập.</p>`}
function csv(rows){return '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function renderTracker(){$('#main').innerHTML=`<div class="pageheader"><div><div class="eyebrow">EXECUTION OFFICE / MASTER PORTFOLIO</div><h1>Master Project Tracker</h1><p>57 dự án · 6 nhóm · Dữ liệu kế hoạch gốc không thay đổi.</p></div><a class="btn" href="#p10/m43">Danh mục gốc →</a></div><section class="panel"><div class="notice">Tiện ích quản trị bổ sung: trạng thái, người phụ trách và ghi chú do người dùng nhập. Dữ liệu chỉ lưu cục bộ trong trình duyệt, không đồng bộ với các máy khác. Trạng thái mặc định là “Chưa cập nhật”.</div><div class="statusbar" id="tracker-stats"></div><div class="filters"><label class="field searchfield">Tìm dự án<input id="pq" type="search" placeholder="Mã hoặc tên dự án…"></label><label class="field">Nhóm<select id="pg"><option value="">Tất cả nhóm</option>${groups.map((g,i)=>`<option value="${'ABCDEF'[i]}">${esc(g)}</option>`).join('')}</select></label><label class="field">Ưu tiên<select id="pp"><option value="">Tất cả</option><option>P1</option><option>P2</option><option>P3</option></select></label><label class="field">Tiến độ dự kiến<select id="pt"><option value="">Tất cả</option><option value="12/2026">12/2026</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option><option>Theo tiến độ</option><option>Theo kế hoạch</option><option>Xuyên suốt</option></select></label><label class="field">Trạng thái<select id="ps"><option value="">Tất cả</option>${statuses.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label></div><div class="panel-head"><span id="tracker-count" class="muted"></span><div><button id="exportcsv" class="btn small">Xuất CSV</button> <button id="backup" class="btn small">Sao lưu JSON</button> <button id="restore" class="btn small">Khôi phục</button><input type="file" accept="application/json,.json" id="restorefile" hidden></div></div><div class="table-scroll"><table class="tracker-table"><thead><tr><th>Mã</th><th>Dự án</th><th>Ưu tiên</th><th>Kế hoạch</th><th>Trạng thái</th><th>Phụ trách</th><th>Ghi chú</th></tr></thead><tbody id="project-rows"></tbody></table></div></section>`;['pq','pg','pp','pt','ps'].forEach(id=>$('#'+id).addEventListener(id==='pq'?'input':'change',drawProjects));$('#exportcsv').onclick=()=>exportFile('OrganicVN-Master-Project-2027.csv',csv([['Mã','Dự án','Ưu tiên','Tiến độ dự kiến','Trạng thái','Phụ trách','Ghi chú'],...data.projects.map(p=>[p.id,p.name,p.priority,p.schedule,getProject(p.id).status,getProject(p.id).owner,getProject(p.id).note])]),'text/csv;charset=utf-8');$('#backup').onclick=()=>exportFile('OrganicVN-2027-backup.json',JSON.stringify({version:2,state},null,2),'application/json');$('#restore').onclick=()=>$('#restorefile').click();$('#restorefile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.version!==2||!x.state||typeof x.state.projects!=='object'||!Array.isArray(x.state.weights)||x.state.weights.length!==8||!x.state.weights.every(v=>typeof v==='number'&&v>=0&&v<=60))throw Error();if(!confirm('Khôi phục bản sao lưu sẽ thay thế dữ liệu theo dõi hiện tại. Tiếp tục?'))return;let s=x.state;state={tasks:{},projects:{},budget:Math.max(0,Number(s.budget)||0),weights:s.weights};for(let i=0;i<20;i++)state.tasks[i]=!!s.tasks?.[i];data.projects.forEach(p=>{let r=s.projects[p.id];if(r)state.projects[p.id]={status:statuses.includes(r.status)?r.status:statuses[0],owner:String(r.owner||''),note:String(r.note||'')}});save();drawProjects();toast('Đã khôi phục dữ liệu.')}catch{toast('Tệp sao lưu không hợp lệ.')}e.target.value=''};drawProjects()}
function quarterMatch(schedule,q){if(!q)return true;if(q==='12/2026')return schedule.includes(q);if(/^Q\d$/.test(q)){if(schedule==='Xuyên suốt')return true;const m=[...schedule.matchAll(/Q([1-4])/g)].map(x=>+x[1]),k=+q[1];return m.length&&(k>=m[0]&&k<=m[m.length-1])}return schedule===q}
function drawProjects(){let c=stats();$('#tracker-stats').innerHTML=statuses.map(s=>`<div class="tile"><strong>${c[s]||0}</strong><small>${s}</small></div>`).join('');let q=norm($('#pq').value),g=$('#pg').value,p=$('#pp').value,t=$('#pt').value,s=$('#ps').value;let list=data.projects.filter(x=>(!q||norm(x.id+' '+x.name).includes(q))&&(!g||x.id.startsWith(g))&&(!p||x.priority===p)&&quarterMatch(x.schedule,t)&&(!s||getProject(x.id).status===s));$('#tracker-count').textContent=`Hiển thị ${list.length}/57 dự án`;$('#project-rows').innerHTML=list.map(x=>{let v=getProject(x.id);return `<tr data-id="${x.id}"><td data-label="Mã"><a class="textlink" href="#p10/project-${x.id}">${x.id}</a></td><td data-label="Dự án">${esc(x.name)}</td><td data-label="Ưu tiên"><span class="priority ${x.priority.toLowerCase()}">${x.priority}</span></td><td data-label="Kế hoạch">${esc(x.schedule)}</td><td data-label="Trạng thái"><select data-field="status" aria-label="Trạng thái ${x.id}">${statuses.map(s=>`<option ${s===v.status?'selected':''}>${esc(s)}</option>`).join('')}</select></td><td data-label="Phụ trách"><input data-field="owner" type="text" value="${esc(v.owner||'')}" placeholder="Chưa phân công" aria-label="Phụ trách ${x.id}"></td><td data-label="Ghi chú"><input data-field="note" type="text" value="${esc(v.note||'')}" placeholder="Ghi chú" aria-label="Ghi chú ${x.id}"></td></tr>`}).join('')||'<tr><td colspan="7">Không tìm thấy dự án phù hợp.</td></tr>';$$('[data-field]',$('#project-rows')).forEach(e=>{e.addEventListener(e.tagName==='SELECT'?'change':'input',()=>{let id=e.closest('tr').dataset.id;state.projects[id]={...getProject(id),[e.dataset.field]:e.value};save();if(e.tagName==='SELECT')drawProjects()})})}
function openSearch(){$('#searchoverlay').classList.add('open');$('#searchinput').focus();searchNow()}
function closeSearch(){$('#searchoverlay').classList.remove('open')}
function searchNow(){let q=$('#searchinput').value.trim(),n=norm(q),terms=n.split(/\s+/).filter(Boolean),r=$('#results');if(!n){r.innerHTML='<p class="muted" style="padding:12px 6px">Tìm kiếm toàn văn 50 mục chiến lược và 57 dự án. Có thể nhập tiếng Việt không dấu.</p>'+['ADIGO','Bao bì','KPI','Ngân sách','Báo chí','Tết 2027'].map(s=>`<button class="btn small" style="margin:4px" data-suggestion="${esc(s)}">${esc(s)}</button>`).join('');$$('[data-suggestion]',r).forEach(b=>b.onclick=()=>{$('#searchinput').value=b.dataset.suggestion;searchNow()});return}let all=data.search.map(s=>({...s,route:`#p${s.p}${s.id?'/'+s.id:''}`,kind:'Chiến lược'})).concat(data.projects.map(p=>({title:p.id+' · '+p.name,body:p.priority+' · '+p.schedule,route:'#p10/project-'+p.id,kind:'Dự án'})));let found=all.filter(x=>terms.every(t=>norm(x.title+' '+x.body).includes(t))).sort((a,b)=>Number(terms.every(t=>norm(b.title).includes(t)))-Number(terms.every(t=>norm(a.title).includes(t))));r.innerHTML=`<p class="muted" style="padding:8px 6px">${found.length} kết quả</p>`+found.slice(0,60).map(x=>{let txt=x.body.replace(/\s+/g,' '),ix=norm(txt).indexOf(terms[0]),start=Math.max(0,ix-45),excerpt=(start?'…':'')+txt.slice(start,start+160)+(txt.length>start+160?'…':'');return `<a class="result" href="${x.route}"><strong>${esc(x.title)}</strong><small>${esc(x.kind)} · ${esc(excerpt)}</small></a>`}).join('');$$('.result',r).forEach(a=>a.onclick=()=>{closeSearch();if(a.getAttribute('href')===location.hash){let id=location.hash.split('/')[1];document.getElementById(id)?.scrollIntoView()}})}
$('#searchbtn').onclick=openSearch;$('#searchclose').onclick=closeSearch;$('#searchinput').oninput=searchNow;$('#searchoverlay').onclick=e=>{if(e.target.id==='searchoverlay')closeSearch()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeNav()}});$('#menubtn').onclick=()=>{$('.sidebar').classList.toggle('open');$('.overlay').classList.toggle('show');const open=$('.sidebar').classList.contains('open');document.body.classList.toggle('nav-open',open);$('#menubtn').setAttribute('aria-expanded',String(open));if(open)$('.sidebar a')?.focus()};$('.overlay').onclick=closeNav;$('#printbtn').onclick=()=>window.print();render();

window.matchMedia("(max-width: 900px)").addEventListener("change",closeNav);
</script></body></html>
