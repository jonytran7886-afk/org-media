"id": "E07", "name": "Sự kiện trình diễn ADIGO", "priority": "P2", "schedule": "Theo tiến độ"}, {"id": "E08", "name": "Hội chợ và triển lãm", "priority": "P2", "schedule": "Theo kế hoạch"}, {"id": "E09", "name": "Chương trình kết nối nhà cung cấp", "priority": "P3", "schedule": "Theo tiến độ"}, {"id": "F01", "name": "Hệ thống quản trị khủng hoảng", "priority": "P1", "schedule": "Q1"}, {"id": "F02", "name": "Quy chế phát ngôn", "priority": "P1", "schedule": "Q1"}, {"id": "F03", "name": "Chương trình truyền thông lãnh đạo", "priority": "P2", "schedule": "Xuyên suốt"}, {"id": "F04", "name": "Chương trình văn hóa và truyền thông nội bộ", "priority": "P2", "schedule": "Xuyên suốt"}, {"id": "F05", "name": "Chương trình kết nối cộng đồng", "priority": "P2", "schedule": "Q2–Q4"}, {"id": "F06", "name": "Khảo sát nhận biết và niềm tin thương hiệu", "priority": "P1", "schedule": "Q1, Q4"}, {"id": "F07", "name": "Báo cáo tổng kết thương hiệu năm 2027", "priority": "P2", "schedule": "Q4"}], "search": [{"p": 1, "id": "m1", "title": "1. Bối cảnh phát triển doanh nghiệp", "body": " Năm 2027 đánh dấu giai đoạn Organic Việt Nam từng bước chuyển từ xây dựng nền tảng sản xuất, đầu tư hạ tầng và phát triển công nghệ sang thương mại hóa sản phẩm, phát triển thị trường và hoàn thiện năng lực vận hành hệ sinh thái.  Organic Việt Nam định hướng phát triển mô hình kinh doanh tích hợp giữa sản xuất nông nghiệp, phát triển sản phẩm thực phẩm, tổ chức chuỗi cung ứng, công nghệ và thương mại.  Mô hình được xây dựng trên ba nền tảng phát triển cốt lõi:  NÔNG NGHIỆP Phát triển năng lực sản xuất và nguồn nguyên liệu. THỰC PHẨM Phát triển sản phẩm, chất lượng và giá trị gia tăng. CÔNG NGHỆ Quản trị, kết nối dữ liệu, thương mại và thị trường.  Ba nền tảng trên được cụ thể hóa thông qua các cấu phần ORGANIC FARM, ORGANIC FOOD, ORGANIC DISTRIBUTION và hệ sinh thái công nghệ – thương mại ADIGO.  Trong giai đoạn đầu năm 2027, trọng tâm thương mại là sản phẩm gà được nuôi theo mô hình ứng dụng thảo dược. Trên cơ sở kết quả triển khai, Organic Việt Nam từng bước mở rộng sang sản phẩm lợn và các danh mục khác phù hợp với năng lực sản xuất, chất lượng và nhu cầu thị trường.  Hoạt động truyền thông cần đồng hành với toàn bộ quá trình phát triển này, từ xây dựng nhận diện doanh nghiệp đến hình thành niềm tin sản phẩm, phát triển thị trường và nâng cao giá trị thương hiệu. "}, {"p": 1, "id": "m2", "title": "2. Tầm nhìn và sứ mệnh truyền thông", "body": " 2.1. Tầm nhìn truyền thông  Xây dựng Organic Việt Nam trở thành thương hiệu có uy tín trong lĩnh vực nông nghiệp, thực phẩm và công nghệ, được nhận diện bởi năng lực tổ chức chuỗi giá trị tích hợp, chất lượng sản phẩm, sự minh bạch thông tin và khả năng phát triển bền vững.  Đồng thời, xây dựng ADIGO trở thành thương hiệu công nghệ có năng lực quản trị, kết nối và tổ chức hoạt động kinh doanh trên nền tảng số, tạo điều kiện mở rộng hệ sinh thái thông qua sự tham gia của các nhà cung cấp, đối tác và khách hàng.  2.2. Sứ mệnh truyền thông  Truyền tải chính xác và nhất quán giá trị của Organic Việt Nam đến thị trường; xây dựng niềm tin đối với doanh nghiệp, sản phẩm và công nghệ; góp phần thúc đẩy hoạt động kinh doanh, nâng cao danh tiếng và tạo dựng nền tảng phát triển dài hạn.  2.3. Triết lý truyền thông  Giá trị thực tạo nên niềm tin. Niềm tin tạo nên sức mạnh thương hiệu. Sức mạnh thương hiệu tạo nền tảng phát triển thị trường.  Truyền thông không thay thế năng lực sản xuất, chất lượng sản phẩm hoặc hiệu quả vận hành mà có trách nhiệm làm cho những giá trị đó được nhận biết, thấu hiểu và ghi nhận. "}, {"p": 1, "id": "m3", "title": "3. Mục tiêu chiến lược năm 2027", "body": " 01 Xác lập vị thế thương hiệu Xây dựng hình ảnh Organic Việt Nam là doanh nghiệp phát triển hệ sinh thái nông nghiệp, thực phẩm và công nghệ có định hướng dài hạn. 02 Xây dựng niềm tin thị trường Minh bạch thông tin về nguồn gốc, quy trình sản xuất, kiểm soát chất lượng và giá trị sản phẩm. 03 Hỗ trợ phát triển kinh doanh Tạo nhận biết, nhu cầu và nền tảng thị trường cho sản phẩm, hệ thống bán lẻ, đại lý, nhà phân phối và cộng tác viên. 04 Phát triển thương hiệu ADIGO Định vị ADIGO là nền tảng công nghệ quản trị và thương mại xuyên suốt chuỗi giá trị. 05 Phát triển quan hệ đối ngoại Xây dựng quan hệ với cơ quan quản lý, báo chí, hiệp hội, đối tác, nhà đầu tư và cộng đồng. 06 Xây dựng năng lực quản trị truyền thông Chuẩn hóa tổ chức, nhân sự, quy trình, quản trị thương hiệu, văn hóa và kiểm soát danh tiếng toàn hệ sinh thái. "}, {"p": 1, "id": "m4", "title": "4. Nguyên tắc chiến lược xuyên suốt", "body": " Truyền thông dựa trên năng lực thực tế và thông tin có thể kiểm chứng. Thống nhất định vị, nhận diện và thông điệp trong toàn bộ hệ sinh thái. Xây dựng thương hiệu dài hạn đồng thời hỗ trợ mục tiêu kinh doanh ngắn hạn. Không sử dụng thuật ngữ “hữu cơ” để định danh hoặc mô tả sản phẩm trong các ấn phẩm thương hiệu. Không sử dụng các cụm từ “gà thảo dược”, “bò thảo dược”; sử dụng cách diễn đạt phù hợp như “gà được nuôi theo mô hình ứng dụng thảo dược”. Không đưa ra các tuyên bố về công dụng sức khỏe, chất lượng hoặc tiêu chuẩn sản phẩm khi chưa có căn cứ xác thực. Không hạ thấp đối thủ cạnh tranh hoặc gây tâm lý lo sợ đối với thực phẩm trên thị trường. Phân biệt rõ năng lực hiện tại, hoạt động đang triển khai và định hướng phát triển trong tương lai. Lấy chất lượng sản phẩm, giá trị khách hàng và uy tín doanh nghiệp làm trọng tâm. "}, {"p": 2, "id": "m5", "title": "5. Mô hình hệ sinh thái Organic Việt Nam", "body": " Organic Việt Nam định hướng xây dựng hệ sinh thái kinh doanh tích hợp, trong đó mỗi cấu phần đảm nhiệm một chức năng chuyên biệt, đồng thời liên kết và bổ trợ lẫn nhau để hình thành chuỗi giá trị xuyên suốt từ sản xuất đến người tiêu dùng.  ORGANIC VIỆT NAM Chiến lược · Đầu tư · Quản trị · Phát triển ↓ ORGANIC FARM Nông nghiệp · Nguồn nguyên liệu ORGANIC FOOD Thực phẩm · Giá trị sản phẩm ORGANIC DISTRIBUTION Chuỗi cung ứng · Lưu chuyển hàng hóa ↓ ADIGO Nền tảng công nghệ quản trị và thương mại · Dữ liệu · Vận hành · Truy xuất · Kết nối thị trường ↓ ADIGO MART Bán lẻ & trải nghiệm ADIGO MARKETPLACE Kết nối thương mại số ↓ CUSTOMER Người tiêu dùng · Khách hàng · Đối tác DOANH THU · DỮ LIỆU · PHẢN HỒI · TĂNG TRƯỞNG Hệ sinh thái mở rộng thông qua nhà cung cấp và đối tác Kiến trúc hệ sinh thái Organic Việt Nam – Mô hình định hướng chiến lược 2027–2029  5.1. ORGANIC VIỆT NAM – Quản trị và định hướng chiến lược  Organic Việt Nam giữ vai trò định hướng phát triển, quản trị hệ sinh thái, đầu tư, phân bổ nguồn lực, quản trị thương hiệu và xây dựng các năng lực cạnh tranh dài hạn.  Toàn bộ cấu phần được phát triển dưới định hướng chiến lược thống nhất, bảo đảm sự đồng bộ về chất lượng, dữ liệu, công nghệ, thương hiệu và mục tiêu kinh doanh.  5.2. ORGANIC FARM – Nền tảng sản xuất nông nghiệp  ORGANIC FARM phát triển nền tảng sản xuất nông nghiệp, tổ chức vùng nuôi trồng, phát triển mô hình ứng dụng thảo dược và xây dựng năng lực cung ứng nguồn nguyên liệu.  Phạm vi định hướng bao gồm:  Chăn nuôi. Trồng trọt. Phát triển vùng dược liệu. Quản lý vùng sản xuất. Nghiên cứu và ứng dụng kỹ thuật sản xuất. Phát triển mạng lưới liên kết sản xuất và nguồn nguyên liệu.  5.3. ORGANIC FOOD – Phát triển sản phẩm và giá trị thực phẩm  ORGANIC FOOD đảm nhiệm chức năng phát triển sản phẩm, hoàn thiện quy cách, tổ chức chế biến, đóng gói, kiểm soát chất lượng và tạo giá trị gia tăng từ nguồn nguyên liệu.  Phạm vi định hướng bao gồm:  Nghiên cứu và phát triển sản phẩm. Xây dựng danh mục thực phẩm. Tổ chức hoặc liên kết giết mổ, sơ chế, chế biến. Pha lóc, đóng gói và hoàn thiện sản phẩm. Quản trị chất lượng và tiêu chuẩn sản phẩm. Phát triển thương hiệu sản phẩm.  5.4. ORGANIC DISTRIBUTION – Chuỗi cung ứng và phân phối  ORGANIC DISTRIBUTION phát triển năng lực tổ chức chuỗi cung ứng, lưu kho, bảo quản, vận chuyển và phân phối, bảo đảm sự lưu chuyển hàng hóa giữa nguồn sản xuất, hệ thống thương mại và khách hàng.  Phạm vi định hướng bao gồm:  Quản lý nguồn cung. Quản lý kho và hàng hóa. Bảo quản và chuỗi lạnh phù hợp từng sản phẩm. Tổ chức giao nhận, vận chuyển. Điều phối hàng hóa. Phân phối đến cửa hàng, đại lý, đối tác và khách hàng.  5.5. ADIGO – Nền tảng công nghệ quản trị và thương mại  ADIGO là nền tảng công nghệ tích hợp, hỗ trợ quản trị vận hành, kết nối dữ liệu, truy xuất nguồn gốc, tổ chức hoạt động thương mại và phát triển thị trường.  ADIGO không chỉ là một ứng dụng bán hàng mà được định hướng trở thành hạ tầng công nghệ hỗ trợ xuyên suốt chuỗi giá trị Organic Việt Nam.  Phạm vi phát triển bao gồm quản trị sản xuất, quản trị chất lượng, chuỗi cung ứng, hàng hóa, khách hàng, hoạt động bán hàng, dữ liệu và kết nối các cấu phần kinh doanh.  5.6. ADIGO MART – Hệ thống bán lẻ và trải nghiệm khách hàng  ADIGO MART định hướng phát triển hoạt động bán lẻ trực tiếp, tổ chức hệ thống điểm bán, nâng cao chất lượng dịch vụ và trải nghiệm mua sắm.  ADIGO MART là cấu phần tiếp xúc trực tiếp với khách hàng, đồng thời là điểm kết nối giữa giá trị sản phẩm, thương hiệu và công nghệ.  5.7. ADIGO MARKETPLACE – Nền tảng kết nối thương mại số  ADIGO MARKETPLACE định hướng phát triển nền tảng kết nối nhà cung cấp, đối tác kinh doanh, hệ thống phân phối và người tiêu dùng.  Cấu phần này tạo điều kiện để hệ sinh thái mở rộng danh mục hàng hóa, nguồn cung và phạm vi thị trường thông qua mạng lưới đối tác bên ngoài, không giới hạn trong năng lực sản xuất nội bộ.  5.8. Mô hình phát triển hệ sinh thái mở  Organic Việt Nam không định hướng phát triển chuỗi giá trị chỉ dựa trên nguồn lực nội bộ mà xây dựng mô hình tích hợp có khả năng mở rộng thông qua hợp tác với nhà cung cấp, đơn vị sản xuất, đối tác chế biến, vận chuyển, phân phối, bán lẻ và công nghệ.  Mọi hoạt động hợp tác cần được tổ chức trên cơ sở tiêu chuẩn chất lượng, năng lực thực tế và cơ chế quản trị phù hợp.  Các tên gọi cấu phần trong tài liệu thể hiện định hướng chức năng và kiến trúc phát triển hệ sinh thái, không mặc định là các pháp nhân độc lập hoặc các đơn vị đã chính thức vận hành. "}, {"p": 2, "id": "m6", "title": "6. Công thức chiến lược và mô hình tạo giá trị", "body": " 6.1. Chuỗi giá trị cốt lõi  FARM Nguyên liệu FOOD Sản phẩm DISTRIBUTION Lưu chuyển ADIGO Thương mại CUSTOMER Giá trị ADIGO – HẠ TẦNG CÔNG NGHỆ XUYÊN SUỐT Quản trị · Dữ liệu · Truy xuất · Kết nối ↶ Dữ liệu · Nhu cầu · Phản hồi khách hàng TỪ NÔNG NGHIỆP ĐẾN BÀN ĂN  Cấu phần Chức năng tạo giá trị FARM Tạo nguồn nguyên liệu FOOD Tạo sản phẩm và giá trị gia tăng DISTRIBUTION Bảo đảm lưu chuyển hàng hóa ADIGO Tổ chức và kết nối thương mại CUSTOMER Tạo doanh thu, dữ liệu, phản hồi và động lực phát triển  Công thức chiến lược được xác lập như sau:  FARM → FOOD → DISTRIBUTION → ADIGO → CUSTOMER  Trong đó, ADIGO MART và ADIGO MARKETPLACE là những cấu phần triển khai hoạt động thương mại và tiếp cận khách hàng thuộc định hướng phát triển của ADIGO.  6.2. Mô hình vận hành tích hợp  Bên cạnh vai trò kết nối thương mại trong chuỗi giá trị, ADIGO còn hỗ trợ xuyên suốt hoạt động quản trị từ ORGANIC FARM, ORGANIC FOOD đến ORGANIC DISTRIBUTION và hệ thống khách hàng.  Dữ liệu về nhu cầu thị trường, kết quả kinh doanh, hành vi tiêu dùng và phản hồi sản phẩm được định hướng kết nối trở lại các cấu phần sản xuất, phát triển sản phẩm và phân phối nhằm nâng cao hiệu quả vận hành.  Đây là nền tảng hình thành chu trình phát triển liên tục:  Sản xuất → Sản phẩm → Phân phối → Thương mại → Khách hàng → Dữ liệu → Cải tiến.  6.3. Vai trò của truyền thông trong chuỗi giá trị  Cấu phần Giá trị kinh doanh Giá trị truyền thông ORGANIC FARM Nguồn nguyên liệu Niềm tin từ nguồn sản xuất ORGANIC FOOD Sản phẩm và giá trị gia tăng Nhận thức về chất lượng và giá trị sản phẩm ORGANIC DISTRIBUTION Lưu chuyển hàng hóa Niềm tin vào năng lực cung ứng và bảo quản ADIGO Công nghệ và thương mại Năng lực quản trị, minh bạch và kết nối ADIGO MART Bán lẻ Trải nghiệm thương hiệu trực tiếp ADIGO MARKETPLACE Kết nối thị trường Cơ hội hợp tác và mở rộng hệ sinh thái CUSTOMER Doanh thu và phản hồi Niềm tin, sự lựa chọn và gắn kết thương hiệu "}, {"p": 2, "id": "m7", "title": "7. Kiến trúc thương hiệu và định vị truyền thông", "body": " Chiến lược truyền thông được tổ chức theo mô hình quản trị thương hiệu tập trung, bảo đảm sự liên kết giữa thương hiệu doanh nghiệp, các cấu phần kinh doanh và thương hiệu công nghệ.  Cấu phần Định danh chức năng Định vị truyền thông ORGANIC VIỆT NAM Corporate & Strategic Management Doanh nghiệp kiến tạo hệ sinh thái giá trị ORGANIC FARM Agricultural Production Năng lực sản xuất và nguồn nguyên liệu ORGANIC FOOD Food Product Development Năng lực phát triển sản phẩm thực phẩm ORGANIC DISTRIBUTION Supply Chain & Distribution Năng lực tổ chức chuỗi cung ứng ADIGO Digital Business Platform Nền tảng công nghệ quản trị và thương mại ADIGO MART Retail & Customer Experience Hệ thống bán lẻ và trải nghiệm khách hàng ADIGO MARKETPLACE Digital Marketplace Nền tảng kết nối thương mại số  Việc hình thành các cấu phần kinh doanh không đồng nghĩa với việc phải phát triển đồng thời các hệ thống logo, website, Fanpage và bộ nhận diện độc lập.  Trong năm 2027, cần ưu tiên xây dựng sức mạnh của hai thương hiệu trọng tâm là Organic Việt Nam và ADIGO . Các cấu phần còn lại được phát triển nhận diện theo chức năng, nhu cầu kinh doanh và mức độ trưởng thành thực tế. "}, {"p": 2, "id": "m8", "title": "8. Hệ thống thông điệp chiến lược", "body": " THÔNG ĐIỆP DOANH NGHIỆP · Kiến tạo hệ sinh thái giá trị Nông nghiệp · Thực phẩm · Công nghệ THÔNG ĐIỆP SẢN PHẨM · Chất lượng làm nên sự khác biệt Phát triển giá trị sản phẩm từ nguồn sản xuất, quy trình kiểm soát chất lượng và sự minh bạch thông tin. THÔNG ĐIỆP CÔNG NGHỆ ADIGO · Công nghệ kết nối giá trị Kết nối dữ liệu, quản trị vận hành, tổ chức thương mại và phát triển thị trường.  8.1. Thông điệp theo từng cấu phần  Cấu phần Định hướng thông điệp ORGANIC VIỆT NAM Kiến tạo hệ sinh thái giá trị ORGANIC FARM Giá trị bắt đầu từ nguồn sản xuất ORGANIC FOOD Chất lượng làm nên sự khác biệt ORGANIC DISTRIBUTION Kết nối nguồn cung – Bảo đảm lưu chuyển ADIGO Công nghệ kết nối giá trị ADIGO MART Kết nối chất lượng với cuộc sống ADIGO MARKETPLACE Mở rộng kết nối – Gia tăng cơ hội  Các thông điệp trên được sử dụng làm định hướng xây dựng nội dung truyền thông. Việc sử dụng làm slogan chính thức cần được phê duyệt trong hệ thống quản trị thương hiệu.  8.2. Chuẩn hóa thuật ngữ truyền thông  Hạn chế sử dụng Thuật ngữ thống nhất Công ty nuôi gà, nuôi lợn Doanh nghiệp phát triển hệ sinh thái nông nghiệp và thực phẩm Gà thảo dược Gà được nuôi theo mô hình ứng dụng thảo dược Thực phẩm sạch Thực phẩm được kiểm soát chất lượng Chuỗi khép kín hoàn toàn Chuỗi giá trị tích hợp Tự sản xuất toàn bộ Phát triển năng lực sản xuất và liên kết nguồn cung Bộ phận giao hàng ORGANIC DISTRIBUTION – Chuỗi cung ứng và phân phối App bán hàng ADIGO Nền tảng công nghệ quản trị và thương mại ADIGO Sàn bán hàng online Nền tảng kết nối thương mại số Hệ sinh thái đã hoàn thiện Hệ sinh thái đang được xây dựng và phát triển Bán sản phẩm nông nghiệp Phát triển và thương mại hóa giá trị sản phẩm "}, {"p": 3, "id": "m9", "title": "9. Phân nhóm đối tượng truyền thông", "body": " Chiến lược truyền thông Organic Việt Nam không chỉ hướng đến người tiêu dùng mà phải bao phủ toàn bộ các bên liên quan đến quá trình phát triển hệ sinh thái, bao gồm khách hàng, đối tác, nhà cung cấp, cơ quan quản lý, báo chí, cộng đồng và đội ngũ nội bộ.  Nhóm đối tượng Mục tiêu truyền thông Cấu phần trọng tâm Người tiêu dùng, hộ gia đình Hiểu sản phẩm, tin tưởng và lựa chọn FOOD, ADIGO MART Cửa hàng, tạp hóa, tiểu thương Hiểu giá trị sản phẩm và cơ hội kinh doanh FOOD, DISTRIBUTION Đại lý, nhà phân phối Tin tưởng năng lực cung ứng và hợp tác DISTRIBUTION, ADIGO Trường học, bếp ăn tập thể Hiểu nguồn cung, chất lượng và quy trình FARM, FOOD, DISTRIBUTION Cơ quan, tổ chức, doanh nghiệp Phát triển quan hệ và cơ hội hợp tác ORGANIC VIỆT NAM Hội Liên hiệp Phụ nữ Kết nối cộng đồng và người tiêu dùng FOOD, ADIGO MART Hội Nông dân Kết nối sản xuất và phát triển thị trường FARM, ADIGO Cộng đồng dân cư, tổ chức tôn giáo Xây dựng nhận biết và niềm tin ORGANIC VIỆT NAM, FOOD Nhà cung cấp, đối tác sản xuất Phát triển liên kết nguồn cung FARM, FOOD Đối tác vận chuyển và phân phối Phát triển năng lực chuỗi cung ứng DISTRIBUTION Cơ quan quản lý nhà nước Hiểu định hướng, năng lực và hoạt động doanh nghiệp ORGANIC VIỆT NAM Báo chí, truyền hình Tiếp cận thông tin chính xác, minh bạch Toàn hệ sinh thái Nhà đầu tư, đối tác chiến lược Hiểu tiềm năng và mô hình tăng trưởng ORGANIC VIỆT NAM, ADIGO Đối tác công nghệ Hiểu kiến trúc, năng lực và tiềm năng nền tảng ADIGO Nhà bán hàng trên nền tảng Hiểu giá trị kết nối và cơ hội thương mại ADIGO MARKETPLACE Nhân viên, Sale, CTV Hiểu doanh nghiệp, sản phẩm và thông điệp Toàn hệ sinh thái "}, {"p": 3, "id": "m10", "title": "10. Chiến lược phát triển phạm vi truyền thông", "body": " KỲ ANH Thương mại HÀ TĨNH Mở rộng quan hệ BẮC TRUNG BỘ Phát triển thị trường TOÀN QUỐC Thương hiệu doanh nghiệp Phát triển thị trường theo từng cấp độ, đồng thời xây dựng thương hiệu ở phạm vi rộng hơn.  Phạm vi Định hướng truyền thông năm 2027 Kỳ Anh Thị trường thương mại trọng điểm, phát triển nhận biết, trải nghiệm sản phẩm và hệ thống bán hàng Hà Tĩnh Mở rộng quan hệ đối tác, báo chí, cơ quan, tổ chức, điểm bán và khách hàng Bắc Trung Bộ Nghiên cứu, xây dựng quan hệ và từng bước phát triển thị trường khi đủ năng lực cung ứng Toàn quốc Xây dựng hình ảnh doanh nghiệp, năng lực công nghệ, danh tiếng và cơ hội hợp tác  Phạm vi truyền thông thương hiệu không nhất thiết đồng nhất với phạm vi thương mại. Organic Việt Nam có thể xây dựng hình ảnh doanh nghiệp ở cấp độ quốc gia trong khi hoạt động bán hàng vẫn tập trung vào các thị trường phù hợp với năng lực vận hành. "}, {"p": 3, "id": "m11", "title": "11. Chiến lược hành trình đối tượng truyền thông", "body": " Hoạt động truyền thông cần được thiết kế theo hành trình nhận thức và ra quyết định của từng nhóm đối tượng.  01 NHẬN BIẾT Biết đến Organic Việt Nam và hệ sinh thái. 02 THẤU HIỂU Hiểu mô hình sản xuất, sản phẩm và công nghệ. 03 TIN TƯỞNG Có niềm tin dựa trên thông tin và bằng chứng. 04 LỰA CHỌN Mua sản phẩm, sử dụng dịch vụ hoặc hợp tác. 05 GẮN KẾT Tiếp tục lựa chọn, phản hồi và giới thiệu.  Truyền thông chịu trách nhiệm chính trong việc xây dựng nhận biết, thấu hiểu và niềm tin. Marketing và Kinh doanh phối hợp phát triển nhu cầu, chuyển đổi thương mại và duy trì mối quan hệ khách hàng. "}, {"p": 4, "id": "m12", "title": "12. Trụ cột 01 – Quản trị thương hiệu", "body": " Brand Management  Mục tiêu  Xây dựng hệ thống thương hiệu nhất quán, chuyên nghiệp, có khả năng mở rộng theo sự phát triển của Organic Việt Nam và ADIGO.  Nội dung triển khai  Hạng mục Định hướng Brand Strategy Chiến lược và định vị thương hiệu Brand Architecture Kiến trúc thương hiệu toàn hệ sinh thái Brand Guidelines Quy chuẩn logo, màu sắc, typography, hình ảnh Corporate Identity Nhận diện doanh nghiệp, văn phòng, nhà điều hành Farm Identity Nhận diện vùng sản xuất và trang trại Product Identity Nhận diện sản phẩm, bao bì, tem nhãn Distribution Identity Nhận diện kho, phương tiện, giao nhận Retail Identity Nhận diện cửa hàng và hệ thống bán lẻ Digital Identity Nhận diện website, ứng dụng và nền tảng số Brand Governance Quy chế quản trị và sử dụng thương hiệu  Nguyên tắc quản trị  Phòng Truyền thông là đầu mối quản trị nhận diện toàn hệ sinh thái. Mọi thiết kế, tài liệu, ấn phẩm chính thức, biển bảng và nội dung sử dụng thương hiệu phải tuân thủ quy chuẩn đã được phê duyệt.  Sử dụng thống nhất bộ logo Organic Việt Nam và ADIGO đã chốt. Không tự ý thay đổi cấu trúc logo, màu sắc, tỷ lệ hoặc tạo thêm các phiên bản nhận diện ngoài quy chuẩn.  Sản phẩm đầu ra  Bộ nhận diện thương hiệu, cẩm nang thương hiệu, quy chế sử dụng thương hiệu, hệ thống template doanh nghiệp và bộ tiêu chuẩn nhận diện theo từng cấu phần kinh doanh. "}, {"p": 4, "id": "m13", "title": "13. Trụ cột 02 – Truyền thông doanh nghiệp", "body": " Corporate Communications  Mục tiêu  Xây dựng hình ảnh Organic Việt Nam là doanh nghiệp phát triển hệ sinh thái tích hợp, có chiến lược dài hạn, năng lực tổ chức sản xuất, phát triển sản phẩm, chuỗi cung ứng và công nghệ.  Các tuyến nội dung trọng tâm  Tuyến nội dung Nội dung khai thác Tầm nhìn và chiến lược Mô hình hệ sinh thái, mục tiêu và định hướng phát triển Năng lực sản xuất Vùng nuôi trồng, cơ sở vật chất, nguồn nguyên liệu Năng lực sản phẩm Phát triển danh mục, hoàn thiện sản phẩm, kiểm soát chất lượng Năng lực chuỗi cung ứng Kho, bảo quản, vận chuyển, phân phối Năng lực công nghệ ADIGO và các ứng dụng quản trị Con người Organic Đội ngũ chuyên môn, kỹ thuật, vận hành Hành trình phát triển Cột mốc, tiến độ, kết quả triển khai Hoạt động đầu tư Hạ tầng, thiết bị, công nghệ Hợp tác phát triển Nhà cung cấp, đối tác, tổ chức, cộng đồng Trách nhiệm doanh nghiệp Việc làm, môi trường và giá trị xã hội  Sản phẩm truyền thông trọng điểm  Hồ sơ năng lực doanh nghiệp, website, phim giới thiệu doanh nghiệp, bộ ảnh thương hiệu, tài liệu đối tác, bộ thông tin báo chí, tài liệu giới thiệu hệ sinh thái và báo cáo hoạt động năm.  Truyền thông doanh nghiệp không chỉ tập trung vào việc giới thiệu quy mô mà phải thể hiện được năng lực tạo giá trị và khả năng tổ chức, quản trị các cấu phần trong hệ sinh thái. "}, {"p": 4, "id": "m14", "title": "14. Trụ cột 03 – Truyền thông sản phẩm và chuỗi giá trị", "body": " Product & Value Chain Communications  Mục tiêu  Xây dựng niềm tin đối với sản phẩm Organic Việt Nam thông qua việc truyền tải giá trị của toàn bộ quá trình từ nguồn nguyên liệu, sản xuất, hoàn thiện sản phẩm, kiểm soát chất lượng đến phân phối và trải nghiệm khách hàng.  01 ORGANIC FARM – Giá trị từ nguồn sản xuất Giống vật nuôi, vùng sản xuất, thức ăn, thảo dược, kỹ thuật nuôi và quy trình chăm sóc. 02 ORGANIC FOOD – Giá trị từ sản phẩm Quy cách, giết mổ, sơ chế, pha lóc, đóng gói và kiểm soát chất lượng. 03 ORGANIC DISTRIBUTION – Giá trị từ chuỗi cung ứng Bảo quản, lưu kho, vận chuyển, giao nhận và lưu chuyển hàng hóa. 04 ADIGO – Giá trị từ công nghệ Quản trị thông tin, kết nối dữ liệu, truy xuất và tổ chức thương mại. 05 ADIGO MART & MARKETPLACE – Giá trị từ thương mại Điểm tiếp cận sản phẩm, trải nghiệm mua hàng và kết nối thị trường. 06 CUSTOMER – Giá trị từ trải nghiệm Chất lượng sử dụng, dịch vụ, phản hồi và sự gắn kết với thương hiệu.  14.1. Chiến lược truyền thông ORGANIC FARM  Tập trung chứng minh năng lực sản xuất và nguồn nguyên liệu bằng hình ảnh, dữ liệu và hoạt động thực tế.  Tuyến nội dung Định hướng Vùng sản xuất Điều kiện tự nhiên, tổ chức vùng nuôi trồng Mô hình chăn nuôi Quy trình chăm sóc, môi trường nuôi Thảo dược Nguồn thảo dược và phương pháp ứng dụng Trồng trọt Vùng trồng, mùa vụ, kỹ thuật Con người Kỹ thuật viên và người lao động Nguồn nguyên liệu Năng lực sản xuất và liên kết nguồn cung Công nghệ sản xuất Quản trị dữ liệu và theo dõi quá trình sản xuất  14.2. Chiến lược truyền thông ORGANIC FOOD  Tập trung làm rõ giá trị sản phẩm thay vì chỉ truyền thông về giá bán hoặc hình ảnh món ăn.  Tuyến nội dung Định hướng Câu chuyện sản phẩm Nguồn gốc, quá trình hình thành Danh mục sản phẩm Đặc điểm, quy cách, lựa chọn phù hợp Kiểm soát chất lượng Quy trình, hồ sơ và kết quả kiểm tra Bao bì và đóng gói Quy cách, thông tin, hướng dẫn sử dụng Giá trị thực phẩm Các đặc điểm có căn cứ xác thực Trải nghiệm Chế biến, bảo quản và phản hồi khách hàng Phát triển sản phẩm Nghiên cứu, cải tiến và mở rộng danh mục  14.3. Chiến lược truyền thông ORGANIC DISTRIBUTION  Tập trung xây dựng niềm tin vào năng lực tổ chức chuỗi cung ứng và chất lượng dịch vụ.  Các nội dung chính bao gồm quản lý hàng hóa, quy trình bảo quản, vận chuyển, giao nhận, cung ứng đến điểm bán, kiểm soát điều kiện lưu chuyển và phối hợp xử lý các vấn đề phát sinh.  Không công bố năng lực kho, chuỗi lạnh, thời gian giao hàng hoặc phạm vi cung ứng khi chưa được bộ phận vận hành xác nhận.  14.4. Chiến lược truyền thông danh mục sản phẩm năm 2027  Danh mục Trọng tâm truyền thông Mức độ ưu tiên Gà Mô hình nuôi, thảo dược, nguồn gốc, chất lượng, quy cách Trọng điểm đầu năm Lợn Nguồn gốc, quy trình chăn nuôi và hoàn thiện sản phẩm Tiếp nối sản phẩm gà Trứng Nguồn sản xuất và quy cách Theo tiến độ Bò, trâu Năng lực sản xuất, chất lượng, chuỗi cung ứng Theo tiến độ Rau củ Vùng trồng, mùa vụ và chất lượng Theo nguồn cung Trái cây Vùng nguyên liệu, sản phẩm và mùa vụ Theo nguồn cung Dược liệu Vai trò trong hệ sinh thái sản xuất Xuyên suốt Các danh mục khác Phát triển theo năng lực và phê duyệt kinh doanh Dự phòng  14.5. Sản phẩm truyền thông thương mại  Bao bì, tem nhãn, catalog, brochure, tờ rơi, POSM, bảng giá, bộ tài liệu Sale và CTV, video sản phẩm, TVC, nội dung truy xuất nguồn gốc và bộ câu hỏi thường gặp.  Mọi tài liệu thương mại cần được kiểm duyệt về thông tin sản phẩm, chất lượng, quy cách, giá bán và chính sách trước khi phát hành. "}, {"p": 4, "id": "m15", "title": "15. Trụ cột 04 – Truyền thông ADIGO", "body": " Technology & Commerce Communications  Mục tiêu  Xây dựng ADIGO trở thành thương hiệu công nghệ có năng lực quản trị, kết nối dữ liệu và tổ chức hoạt động thương mại, đồng thời thể hiện khả năng mở rộng của hệ sinh thái Organic Việt Nam.  15.1. Định vị năng lực ADIGO  ADIGO Digital Business Platform Quản trị sản xuất Production Management Quản trị chất lượng Quality Management Chuỗi cung ứng Supply Chain Thương mại Commerce Quản trị khách hàng Customer Management Truy xuất nguồn gốc Traceability Các nhóm năng lực công nghệ định hướng truyền thông của ADIGO.  Truyền thông ADIGO phải thể hiện được ba lớp giá trị:  Lớp giá trị Nội dung Quản trị Số hóa và kết nối các hoạt động vận hành Dữ liệu Tổ chức thông tin, truy xuất, hỗ trợ quản trị và ra quyết định Thương mại Kết nối nguồn cung, hệ thống bán hàng và khách hàng  15.2. Truyền thông ADIGO MART  Định hướng xây dựng hình ảnh hệ thống bán lẻ chuyên nghiệp, kết nối sản phẩm, công nghệ và trải nghiệm người tiêu dùng.  Nội dung trọng tâm gồm nhận diện điểm bán, trải nghiệm mua sắm, thông tin sản phẩm, dịch vụ khách hàng, quy trình bán hàng và ứng dụng công nghệ tại điểm bán.  Trong thời gian hoàn thiện kiến trúc thương hiệu bán lẻ, việc sử dụng tên Cửa hàng chuyên doanh Organic Việt Nam hoặc ADIGO MART phải thống nhất theo quyết định thương hiệu được Ban lãnh đạo phê duyệt, tránh tạo hai hệ thống nhận diện cạnh tranh lẫn nhau.  15.3. Truyền thông ADIGO MARKETPLACE  Định hướng xây dựng hình ảnh nền tảng thương mại số kết nối nguồn cung, đối tác kinh doanh và người tiêu dùng.  Các tuyến nội dung bao gồm cơ hội hợp tác, giá trị đối với nhà cung cấp, khả năng kết nối thị trường, quản trị giao dịch, trải nghiệm nền tảng và tiềm năng mở rộng hệ sinh thái.  Chỉ triển khai chiến dịch thu hút nhà bán hàng hoặc người dùng khi các chức năng và điều kiện vận hành tương ứng đã sẵn sàng.  15.4. Chiến lược thông điệp theo đối tượng  Đối tượng Giá trị cần truyền tải Người tiêu dùng Tiếp cận sản phẩm, thông tin và trải nghiệm mua hàng Bộ phận sản xuất Quản trị quy trình, dữ liệu và vận hành Nhà cung cấp Kết nối nguồn cung và thị trường Đại lý, nhà phân phối Quản lý hàng hóa và hoạt động thương mại Đơn vị bán lẻ Quản trị điểm bán và trải nghiệm khách hàng Doanh nghiệp Số hóa hoạt động và quản trị chuỗi giá trị Đối tác công nghệ Kiến trúc, khả năng tích hợp và mở rộng Nhà đầu tư Mô hình phát triển, năng lực và tiềm năng hệ sinh thái  15.5. Sản phẩm truyền thông ADIGO  Website, hồ sơ năng lực công nghệ, video giới thiệu nền tảng, bộ mockup desktop/tablet/mobile, tài liệu giải pháp, video trình diễn tính năng, video hướng dẫn, sự kiện Demo Day và tài liệu hợp tác.  Thông tin truyền thông phải phân biệt rõ tính năng đã vận hành, tính năng đang thử nghiệm và lộ trình phát triển. "}, {"p": 4, "id": "m16", "title": "16. Trụ cột 05 – Báo chí và quan hệ công chúng", "body": " Public Relations & Media Relations  Mục tiêu  Xây dựng uy tín và danh tiếng doanh nghiệp thông qua hệ thống báo chí, quan hệ công chúng và các hoạt động đối ngoại có định hướng dài hạn.  16.1. Phân nhóm báo chí và nội dung tiếp cận  Nhóm truyền thông Nội dung trọng tâm Báo chí địa phương Hoạt động sản xuất, việc làm, kinh tế địa phương Báo chí nông nghiệp ORGANIC FARM, nguồn nguyên liệu, mô hình ứng dụng thảo dược Báo chí thực phẩm ORGANIC FOOD, phát triển sản phẩm, kiểm soát chất lượng Báo chí kinh tế Chiến lược, đầu tư, chuỗi giá trị, phát triển thị trường Báo chí công nghệ ADIGO, dữ liệu, số hóa và quản trị Báo chí thương mại Hệ thống bán lẻ, phân phối và kết nối thị trường Truyền hình Phóng sự thực tế, mô hình sản xuất, câu chuyện doanh nghiệp  16.2. Mạng lưới quan hệ báo chí  Danh sách định hướng tiếp cận có thể bao gồm báo chí và truyền hình Hà Tĩnh, VTV, VOV, Thông tấn xã Việt Nam, VnExpress, Dân trí, VietnamNet cùng các cơ quan báo chí chuyên ngành nông nghiệp, thực phẩm, kinh tế và công nghệ.  Đây là danh sách đối tượng nghiên cứu, tiếp cận và phát triển quan hệ, không phải danh sách đối tác truyền thông đã xác lập.  16.3. Chương trình hoạt động  Hoạt động Mục tiêu Media Relations Xây dựng và duy trì quan hệ báo chí Press Kit Chuẩn hóa nguồn thông tin cung cấp cho báo chí Media Visit Tổ chức đoàn báo chí tham quan thực tế Press Release Thông cáo các cột mốc quan trọng Executive Interview Phỏng vấn lãnh đạo và chuyên gia Feature Story Phóng sự và bài viết chuyên sâu Media Monitoring Theo dõi báo chí và dư luận Crisis Communications Phối hợp xử lý sự cố truyền thông  16.4. Định hướng chủ đề PR năm 2027  Tập trung vào câu chuyện phát triển hệ sinh thái, năng lực sản xuất nông nghiệp, mô hình ứng dụng thảo dược, chất lượng thực phẩm, tổ chức chuỗi cung ứng, công nghệ ADIGO và đóng góp đối với phát triển kinh tế – xã hội.  Ưu tiên các bài viết có giá trị thông tin thực tế, tránh nội dung quảng cáo một chiều hoặc khai thác hình ảnh doanh nghiệp quá mức so với năng lực hiện có. "}, {"p": 4, "id": "m17", "title": "17. Trụ cột 06 – Truyền thông lãnh đạo", "body": " Executive Communications  Mục tiêu  Xây dựng hình ảnh Chủ tịch và đội ngũ lãnh đạo là những đại diện có trách nhiệm, có tầm nhìn, am hiểu lĩnh vực hoạt động và có định hướng phát triển doanh nghiệp dài hạn.  Tuyến nội dung trọng tâm  Nội dung Định hướng Câu chuyện người sáng lập Động lực và quá trình phát triển doanh nghiệp Tâm huyết với nông nghiệp Quan điểm về sản xuất và giá trị thực phẩm Tầm nhìn chiến lược Mô hình hệ sinh thái và định hướng dài hạn Triết lý chất lượng Trách nhiệm đối với sản phẩm và khách hàng Tư duy công nghệ Vai trò của ADIGO và chuyển đổi số Hoạt động thực địa Kết nối giữa lãnh đạo và hoạt động sản xuất Quan hệ đối ngoại Hợp tác, phát triển thị trường và cộng đồng  Năng lực doanh nghiệp và hệ sinh thái 50% Đội ngũ, chuyên gia và người lao động 30% Chủ tịch và Ban lãnh đạo 20% Định hướng tỷ trọng khai thác hình ảnh trong nội dung doanh nghiệp  Không xây dựng thương hiệu doanh nghiệp phụ thuộc hoàn toàn vào hình ảnh một cá nhân. Hình ảnh lãnh đạo cần bổ trợ cho giá trị tổ chức, đội ngũ và năng lực hệ sinh thái. "}, {"p": 4, "id": "m18", "title": "18. Trụ cột 07 – Truyền thông số", "body": " Digital Communications  Mục tiêu  Xây dựng hệ thống kênh truyền thông số đồng bộ, có vai trò rõ ràng, tiếp cận đúng đối tượng và tích lũy tài sản thương hiệu dài hạn.  18.1. Kiến trúc hệ thống kênh  Kênh Vai trò Tần suất đề xuất Website Organic Việt Nam Trung tâm thông tin chính thống 4–8 bài/tháng Facebook Organic Việt Nam Doanh nghiệp, sản xuất, sản phẩm 5–7 bài/tuần TikTok Video thực tế, quy trình, trải nghiệm 3–5 video/tuần YouTube Phim doanh nghiệp, phóng sự, video chuyên sâu 2–4 video/tháng Zalo OA Kết nối khách hàng địa phương 2–3 nội dung/tuần LinkedIn Doanh nghiệp, công nghệ, đối tác 2–4 bài/tháng Website ADIGO Năng lực nền tảng và giải pháp 2–4 bài/tháng Facebook ADIGO Công nghệ, tính năng, ứng dụng 2–3 bài/tuần Email doanh nghiệp Bản tin, đối tác, hợp tác 1–2 bản tin/tháng Kênh bán lẻ Sản phẩm, điểm bán, trải nghiệm Theo kế hoạch thương mại Kênh nội bộ Văn hóa, thông tin và điều hành Theo nhu cầu  Tần suất là mục tiêu vận hành đề xuất, có thể điều chỉnh theo nguồn lực và chất lượng tư liệu. Các kênh có thể sử dụng chung tài nguyên nội dung nhưng phải biên tập phù hợp với từng nền tảng.  18.2. Mô hình truyền thông tích hợp PESO  Paid Media · Truyền thông trả phí Quảng cáo thương hiệu, phân phối nội dung, hợp tác truyền thông có trả phí. Earned Media · Truyền thông lan tỏa tự nhiên Báo chí đưa tin độc lập, đánh giá, đề cập thương hiệu và uy tín cộng đồng. Shared Media · Truyền thông chia sẻ Mạng xã hội, cộng đồng, đối tác, nhân viên và khách hàng. Owned Media · Kênh truyền thông sở hữu Website, ứng dụng, Fanpage, email và hệ thống nội dung doanh nghiệp.  Organic Việt Nam cần ưu tiên phát triển kênh sở hữu, kết hợp quan hệ báo chí, cộng đồng và truyền thông trả phí để gia tăng mức độ tiếp cận.  18.3. Nguyên tắc quản trị kênh  Tài khoản và dữ liệu kênh truyền thông thuộc quyền quản lý của doanh nghiệp. Phòng Truyền thông chịu trách nhiệm phân quyền, bảo mật, quản lý nội dung, theo dõi hiệu quả và xử lý thông tin phát sinh.  Không phát triển hàng loạt kênh riêng cho từng cấu phần khi chưa đủ nguồn lực duy trì. "}, {"p": 4, "id": "m19", "title": "19. Trụ cột 08 – Sự kiện và trải nghiệm thương hiệu", "body": " Event & Brand Experience  Mục tiêu  Chuyển hóa giá trị thương hiệu thành trải nghiệm thực tế, tạo điều kiện để khách hàng, đối tác, báo chí và cộng đồng hiểu rõ hơn về doanh nghiệp, sản phẩm và hệ sinh thái.  Chương trình Nội dung Cấu phần trọng tâm Farm Tour Tham quan và tìm hiểu vùng sản xuất FARM Media Tour Trải nghiệm thực tế dành cho báo chí ORGANIC VIỆT NAM Product Launch Ra mắt sản phẩm FOOD Product Experience Trải nghiệm, sử dụng và phản hồi sản phẩm FOOD Supply Chain Visit Giới thiệu năng lực chuỗi cung ứng DISTRIBUTION Store Opening Khai trương điểm bán Hệ thống bán lẻ Partner Conference Hội nghị đối tác, đại lý, nhà phân phối Toàn hệ sinh thái ADIGO Demo Day Trình diễn năng lực công nghệ ADIGO Supplier Connect Kết nối nhà cung cấp và đối tác FARM, FOOD, MARKETPLACE Hội chợ, triển lãm Giới thiệu thương hiệu và kết nối thị trường Toàn hệ sinh thái Hội nghị doanh nghiệp Phát triển quan hệ cấp tổ chức ORGANIC VIỆT NAM  Mỗi sự kiện cần xác lập mục tiêu, đối tượng, ngân sách, nội dung, kế hoạch truyền thông trước – trong – sau sự kiện và chỉ tiêu đánh giá cụ thể.  Các chương trình tham quan vùng sản xuất phải tuân thủ yêu cầu an toàn sinh học và điều kiện vận hành của trang trại. "}, {"p": 4, "id": "m20", "title": "20. Trụ cột 09 – Truyền thông cộng đồng và nội bộ", "body": " Community Relations & Internal Communications  20.1. Truyền thông cộng đồng  Xây dựng quan hệ tích cực giữa Organic Việt Nam và cộng đồng tại các địa bàn hoạt động thông qua giá trị thực tế.  Các chương trình trọng tâm gồm kết nối hội phụ nữ, hội nông dân, tổ chức địa phương, hoạt động tìm hiểu sản xuất, chia sẻ kiến thức bảo quản và chế biến thực phẩm, phát triển việc làm, kết nối nguồn cung và hợp tác cộng đồng.  20.2. Truyền thông nội bộ  Phối hợp với phòng Nhân sự xây dựng hệ thống truyền thông nội bộ phù hợp với quá trình mở rộng tổ chức.  Nội dung Kết quả cần đạt Tầm nhìn, sứ mệnh và giá trị cốt lõi Nhân sự hiểu định hướng doanh nghiệp Kiến trúc hệ sinh thái Hiểu chức năng và quan hệ giữa các cấu phần Văn hóa doanh nghiệp Thống nhất cách làm việc và ứng xử Đào tạo thương hiệu Sử dụng nhận diện và thông điệp chính xác Đào tạo thông tin sản phẩm Nhân viên, Sale, CTV hiểu và tư vấn đúng Truyền thông tuyển dụng Thu hút nhân sự phù hợp Bản tin nội bộ Kết nối các bộ phận Quy định phát ngôn Kiểm soát rủi ro thông tin Hoạt động gắn kết Tăng cường tinh thần đồng hành  Mỗi nhân sự Organic Việt Nam cần hiểu được doanh nghiệp đang tạo ra giá trị gì, bộ phận của mình đóng vai trò như thế nào trong chuỗi giá trị và cần truyền tải thông tin ra bên ngoài theo nguyên tắc nào. "}, {"p": 4, "id": "m21", "title": "21. Trụ cột 10 – Quản trị danh tiếng và khủng hoảng", "body": " Reputation & Crisis Management  Mục tiêu  Bảo vệ uy tín doanh nghiệp, giảm thiểu rủi ro truyền thông và xây dựng khả năng phản ứng chuyên nghiệp khi phát sinh sự cố trong toàn bộ hệ sinh thái.  21.1. Danh mục rủi ro trọng điểm  Nhóm rủi ro Đơn vị chuyên môn phối hợp Nội dung chuẩn bị Dịch bệnh, sự cố sản xuất FARM Quy trình xác minh và thông báo An toàn thực phẩm FOOD, QA Hồ sơ, quy trình phản hồi và thu hồi khi cần Nguồn gốc sản phẩm FARM, FOOD, ADIGO Hồ sơ nguồn gốc và dữ liệu Thông tin về thảo dược FARM, chuyên gia Căn cứ và kiểm duyệt thông tin Bảo quản, giao nhận DISTRIBUTION Quy trình xử lý sự cố hàng hóa Khiếu nại khách hàng Kinh doanh, bán lẻ Tiếp nhận, giải quyết và phản hồi Sự cố nền tảng ADIGO, Công nghệ Thông báo và xử lý kỹ thuật Sự cố dữ liệu cá nhân Công nghệ, pháp chế Quy trình bảo mật và thông báo phù hợp Nhà cung cấp vi phạm Bộ phận quản lý đối tác Xác minh, xử lý và kiểm soát ảnh hưởng Phát ngôn thiếu kiểm soát Nhân sự, lãnh đạo Quy chế phát ngôn Tin giả và thông tin sai lệch Truyền thông Giám sát, xác minh, phản hồi  21.2. Quy trình xử lý khủng hoảng  Phát hiện, tiếp nhận và lưu giữ thông tin sự cố. Xác minh với đơn vị chuyên môn chịu trách nhiệm. Đánh giá mức độ, phạm vi và tác động. Kích hoạt cơ chế báo cáo và tổ xử lý khủng hoảng. Thống nhất biện pháp khắc phục và thông điệp phát ngôn. Triển khai thông tin trên các kênh phù hợp. Giám sát phản hồi và cập nhật diễn biến. Đánh giá kết quả, phục hồi danh tiếng và cải tiến quy trình.  Giám đốc Truyền thông chịu trách nhiệm điều phối thông tin, quản trị danh tiếng và đề xuất phương án phát ngôn. Các đơn vị chuyên môn chịu trách nhiệm xác minh nguyên nhân và trực tiếp xử lý sự cố. Ban lãnh đạo phê duyệt các quyết định quan trọng theo cơ chế phân quyền. "}, {"p": 5, "id": "m22", "title": "22. Ma trận nội dung truyền thông năm 2027", "body": " Chiến lược nội dung cần phản ánh đầy đủ mô hình tạo giá trị của Organic Việt Nam, đồng thời bảo đảm sự cân đối giữa xây dựng thương hiệu, truyền thông sản phẩm, công nghệ, thương mại và phát triển cộng đồng.  Doanh nghiệp & thương hiệu 25% Sản xuất & thảo dược 20% Sản phẩm & chất lượng 25% Chuỗi cung ứng & phân phối 5% Công nghệ & thương mại ADIGO 15% Khách hàng, đối tác & cộng đồng 10% Tỷ trọng đề xuất cho hệ thống nội dung truyền thông tích hợp toàn hệ sinh thái. Điều chỉnh theo từng quý và chiến dịch.  22.1. Phân bổ nguồn lực theo cấu phần  Cấu phần Tỷ trọng đề xuất Trọng tâm ORGANIC VIỆT NAM 25% Doanh nghiệp, chiến lược, danh tiếng ORGANIC FARM 20% Sản xuất, nguồn nguyên liệu, thảo dược ORGANIC FOOD 25% Sản phẩm, chất lượng, thương mại hóa ORGANIC DISTRIBUTION 5% Chuỗi cung ứng và lưu chuyển hàng hóa ADIGO 15% Công nghệ, quản trị, dữ liệu ADIGO MART 7% Bán lẻ và trải nghiệm khách hàng ADIGO MARKETPLACE 3% Kết nối thị trường và đối tác Tổng cộng 100%  Đây là tỷ trọng định hướng nguồn lực truyền thông, không phải tỷ trọng doanh thu hoặc ngân sách cố định của từng cấu phần. "}, {"p": 5, "id": "m23", "title": "23. Xây dựng các series truyền thông dài hạn", "body": " Mã Series Nội dung Cấu phần SER-01 Hành trình Organic Việt Nam Hình thành và phát triển doanh nghiệp ORGANIC VIỆT NAM SER-02 Từ vùng sản xuất Hoạt động thực tế tại vùng nuôi trồng FARM SER-03 Hiểu về thảo dược Nguồn thảo dược và ứng dụng thực tế FARM SER-04 Hành trình của sản phẩm Từ nguyên liệu đến thực phẩm FARM, FOOD SER-05 Chất lượng từ quy trình Các bước kiểm soát chất lượng FOOD SER-06 Hành trình đến bàn ăn Bảo quản, vận chuyển, giao nhận DISTRIBUTION SER-07 Con người Organic Đội ngũ, kỹ thuật viên, người lao động Toàn hệ sinh thái SER-08 Câu chuyện người sáng lập Tầm nhìn và triết lý phát triển ORGANIC VIỆT NAM SER-09 Công nghệ kết nối giá trị ADIGO và các ứng dụng thực tế ADIGO SER-10 Minh bạch nguồn gốc Hồ sơ sản phẩm, dữ liệu và truy xuất FOOD, ADIGO SER-11 Góc nhìn chuyên gia Kiến thức sản xuất, thực phẩm và công nghệ Toàn hệ sinh thái SER-12 Bếp nhà Organic Chế biến, bảo quản và sử dụng thực phẩm FOOD SER-13 Trải nghiệm cùng Organic Điểm bán, khách hàng và dịch vụ Hệ thống bán lẻ SER-14 Đồng hành phát triển Nhà cung cấp, đối tác và cộng đồng Toàn hệ sinh thái SER-15 Kết nối thị trường Cơ hội hợp tác và thương mại số ADIGO MARKETPLACE  Các series được phát triển thành tài sản nội dung dài hạn, có hệ thống nhận diện, định dạng, lịch xuất bản và phương pháp đo lường riêng. "}, {"p": 5, "id": "m24", "title": "24. Chiến lược sản xuất tài nguyên truyền thông", "body": " 24.1. Hệ thống video  Nhóm video Nội dung Corporate Film Giới thiệu Organic Việt Nam và hệ sinh thái Brand Film Triết lý, tầm nhìn và giá trị thương hiệu Product TVC Truyền thông sản phẩm và chiến dịch thương mại Documentary Phóng sự thực tế về vùng sản xuất Production Video Quy trình sản xuất, kỹ thuật, thảo dược Supply Chain Video Kho, bảo quản, vận chuyển và phân phối Technology Video Giới thiệu, trình diễn năng lực ADIGO Retail Video Điểm bán và trải nghiệm khách hàng Interview Video Lãnh đạo, chuyên gia, đối tác Short-form Video Reels, TikTok, Shorts Customer Story Trải nghiệm và phản hồi khách hàng Event Recap Tổng hợp sự kiện và hoạt động đối ngoại  24.2. Hệ thống hình ảnh và thiết kế  Nhóm tài nguyên Nội dung Corporate Photography Nhà điều hành, văn phòng, nhân sự Farm Photography Trang trại, vật nuôi, cây trồng, thảo dược Product Photography Hình ảnh sản phẩm, quy cách đóng gói Distribution Photography Kho, phương tiện, giao nhận Technology Mockup Desktop, tablet, mobile và giao diện ADIGO Retail Photography Điểm bán và trải nghiệm khách hàng Corporate Publications Hồ sơ năng lực, báo cáo, presentation Sales Publications Catalog, brochure, leaflet, POSM Digital Creative Banner, infographic, social media Brand Assets Logo, font, icon, template, guideline  Đối với hình ảnh nhà điều hành, sử dụng đúng phối cảnh thiết kế đã được phê duyệt và chú thích phù hợp khi công bố. Không trình bày ảnh phối cảnh như hình ảnh công trình đã hoàn thành.  24.3. Quản trị kho tài nguyên truyền thông  Xây dựng kho tài nguyên tập trung theo mô hình Digital Asset Management, thống nhất cấu trúc lưu trữ, phân quyền, quản lý phiên bản và quyền sử dụng.  ORGANIC COMMUNICATIONS 01 01. Strategy & Brand Management Chiến lược, guideline, logo, nhận diện 02 02. Corporate Communications Hồ sơ doanh nghiệp, lãnh đạo, đối ngoại 03 03. Organic Farm Vùng sản xuất, nguyên liệu, thảo dược 04 04. Organic Food Sản phẩm, bao bì, catalog, chất lượng 05 05. Organic Distribution Kho, bảo quản, giao nhận, vận chuyển 06 06. ADIGO Ecosystem Công nghệ, Mart, Marketplace 07 07. Media Production Ảnh gốc, video gốc, file dựng, thành phẩm 08 08. PR & Events Báo chí, press kit, sự kiện 09 09. Campaigns Chiến dịch và nội dung xuất bản 10 10. Reports & Archive Báo cáo, KPI, lưu trữ  Mỗi tài nguyên cần có thông tin về ngày tạo, nguồn, người thực hiện, quyền sử dụng, trạng thái phê duyệt và phân loại rõ hình ảnh thực tế, phối cảnh, hình ảnh minh họa hoặc nội dung được tạo bằng công nghệ AI. "}, {"p": 6, "id": "m25", "title": "25. Chiến lược triển khai theo quý", "body": " Q1 · Tháng 1–3 Xác lập thương hiệu – Ra mắt sản phẩm Hoàn thiện nền tảng thương hiệu, tập trung FARM và FOOD, thương mại hóa sản phẩm gà, triển khai chiến dịch Tết 2027 và truyền thông các năng lực ADIGO đã sẵn sàng. Q2 · Tháng 4–6 Củng cố niềm tin – Phát triển danh mục Truyền thông chất lượng, trải nghiệm khách hàng, chuẩn bị danh mục sản phẩm tiếp theo và làm rõ năng lực ORGANIC DISTRIBUTION. Q3 · Tháng 7–9 Mở rộng thị trường – Kết nối hệ sinh thái Phát triển truyền thông đối tác, nhà cung cấp, hệ thống phân phối, bán lẻ và các giải pháp ADIGO phù hợp tiến độ vận hành. Q4 · Tháng 10–12 Nâng cao vị thế – Tích hợp giá trị Truyền thông tổng thể hệ sinh thái, tổng kết năng lực, phát triển quan hệ chiến lược và chuẩn bị kế hoạch năm 2028. "}, {"p": 6, "id": "m26", "title": "26. Kế hoạch truyền thông theo 12 tháng", "body": " Tháng Chủ đề trọng tâm Hoạt động chính 01 Hành trình sản phẩm đầu tiên Giới thiệu vùng sản xuất, mô hình nuôi, hoàn thiện bao bì, catalog, TVC và chuẩn bị ra mắt 02 Tết cùng Organic Việt Nam Truyền thông sản phẩm gà, điểm bán, trải nghiệm khách hàng và hỗ trợ thương mại 03 Chất lượng tạo dựng niềm tin Đánh giá chiến dịch, phản hồi khách hàng, truyền thông chất lượng, Farm Tour 04 Phát triển chuỗi giá trị Giới thiệu FARM – FOOD – DISTRIBUTION và chuẩn bị danh mục tiếp theo 05 Giá trị từ thảo dược Truyền thông vùng dược liệu, trồng trọt và mô hình ứng dụng thảo dược 06 Công nghệ và minh bạch ADIGO, dữ liệu, truy xuất và quản trị vận hành 07 Kết nối nguồn cung và thị trường Nhà cung cấp, đại lý, đối tác và năng lực phân phối 08 Con người và cộng đồng Văn hóa doanh nghiệp, nhân sự, chuyên gia, cộng đồng 09 Trải nghiệm thương hiệu Khách hàng, điểm bán, dịch vụ và các chương trình trải nghiệm 10 Hệ sinh thái Organic – ADIGO Chiến dịch tích hợp, năng lực công nghệ và mô hình tạo giá trị 11 Đồng hành phát triển Hội nghị đối tác, nhà cung cấp, cơ hội hợp tác và kết nối thị trường 12 Hành trình một năm kiến tạo Tổng kết năm 2027, báo cáo thương hiệu và định hướng năm 2028  Đây là lịch chủ đề cấp chiến lược. Mỗi tháng cần xây dựng kế hoạch tác nghiệp riêng, bao gồm danh mục công việc, lịch sản xuất, lịch xuất bản, người phụ trách, ngân sách và KPI. "}, {"p": 6, "id": "m27", "title": "27. Danh mục chiến dịch cấp doanh nghiệp", "body": " Mã Chiến dịch Thời gian Cấu phần trọng tâm CAM-01 Kiến tạo hệ sinh thái giá trị Xuyên suốt ORGANIC VIỆT NAM CAM-02 Hành trình sản phẩm đầu tiên Q1 FARM, FOOD CAM-03 Tết cùng Organic Việt Nam Q1 FOOD, DISTRIBUTION, bán lẻ CAM-04 Chất lượng từ quy trình Q1–Q2 FARM, FOOD, ADIGO CAM-05 Giá trị từ thảo dược Q2–Q3 FARM CAM-06 Hành trình từ sản xuất đến bàn ăn Q2–Q4 FARM, FOOD, DISTRIBUTION CAM-07 ADIGO – Công nghệ kết nối giá trị Q2–Q4 ADIGO CAM-08 Trải nghiệm cùng Organic Việt Nam Q2–Q4 FOOD, bán lẻ CAM-09 Đồng hành kiến tạo giá trị Q3–Q4 Đối tác, nhà cung cấp CAM-10 Kết nối thị trường Theo tiến độ ADIGO MARKETPLACE CAM-11 Hành trình một năm kiến tạo Q4 Toàn hệ sinh thái  Tiến độ triển khai các chiến dịch  Chiến dịch Q1 Q2 Q3 Q4 Thương hiệu doanh nghiệp Ra mắt sản phẩm gà Chiến dịch Tết Chất lượng sản phẩm Giá trị thảo dược Chuỗi giá trị Công nghệ ADIGO Trải nghiệm khách hàng Đối tác & nguồn cung Tổng kết thương hiệu Tiến độ dự kiến, chưa bao gồm các chiến dịch phát sinh hoặc cấu phần chưa đủ điều kiện ra mắt. "}, {"p": 6, "id": "m28", "title": "28. Kế hoạch trọng điểm 90 ngày trước và trong giai đoạn ra mắt sản phẩm đầu tiên", "body": " 28.1. Giai đoạn chuẩn bị cuối năm 2026  Thời gian Công việc trọng điểm 24–30/11/2026 Chốt chiến lược, nhân sự, định vị, thông điệp và danh mục công việc 01–10/12/2026 Hoàn thiện nhận diện, kế hoạch nội dung, kịch bản, thu thập tư liệu 11–20/12/2026 Sản xuất video, hoàn thiện website, thiết kế bao bì, catalog, tờ rơi 21–31/12/2026 Hoàn thiện bộ tài liệu bán hàng, kế hoạch ra mắt, kết nối báo chí và đối tác  28.2. Giai đoạn truyền thông trước thương mại  Tập trung giúp thị trường hiểu Organic Việt Nam, nguồn gốc sản phẩm, mô hình chăn nuôi ứng dụng thảo dược, quá trình hoàn thiện sản phẩm và năng lực kiểm soát chất lượng.  Đồng thời phối hợp với Marketing và Kinh doanh tiếp nhận nhu cầu, chuẩn bị dữ liệu khách hàng, triển khai nội dung cho đội ngũ Sale, CTV và hệ thống điểm bán.  28.3. Giai đoạn thương mại hóa  Tập trung chiến dịch ra mắt sản phẩm gà, truyền thông điểm bán, quy cách sản phẩm, chương trình trải nghiệm, phản hồi khách hàng và hỗ trợ các kênh phân phối.  Do kế hoạch sản xuất được tổ chức theo lứa gối đầu, chiến dịch truyền thông cũng cần được triển khai theo chu kỳ tương ứng.  Chu kỳ truyền thông theo từng lứa sản phẩm 01 Trước ngày mở bán 7–14 ngày Giới thiệu lứa sản phẩm, nguồn gốc, thông tin chất lượng và tiếp nhận nhu cầu. 02 Ngày mở bán Công bố sản phẩm, quy cách, kênh mua hàng và nội dung chiến dịch. 03 Ngày 1–7 Tăng cường nội dung tại điểm bán, trải nghiệm, hướng dẫn và phản hồi khách hàng. 04 Ngày 8–14 Phối hợp Kinh doanh theo dõi sức mua, điều chỉnh nội dung và hỗ trợ hoàn thành mục tiêu từng lứa. 05 Kết thúc chu kỳ Đánh giá hiệu quả, phản hồi chất lượng, cải tiến và chuẩn bị lứa tiếp theo.  Truyền thông cần bám sát mục tiêu bán hết từng lứa trong vòng hai tuần, nhưng không chịu trách nhiệm thay cho Kinh doanh về doanh số, tồn kho hoặc khả năng cung ứng.  28.4. Điều kiện kích hoạt chiến dịch thương mại  Điều kiện Đơn vị xác nhận Nguồn cung và lịch xuất bán FARM, Kinh doanh Hồ sơ chất lượng và điều kiện sản phẩm FOOD, QA, pháp chế Quy cách, giá và chính sách bán hàng Kinh doanh Bao bì, tem nhãn, thông tin công bố FOOD, QA, Truyền thông Năng lực lưu kho, giao nhận DISTRIBUTION Tính năng công nghệ được giới thiệu ADIGO, Công nghệ Kênh bán hàng và tiếp nhận đơn Marketing, Kinh doanh Nội dung và kế hoạch truyền thông Giám đốc Truyền thông  Mốc ra mắt được quyết định trên cơ sở mức độ sẵn sàng thực tế của toàn chuỗi giá trị, không chỉ dựa vào lịch truyền thông. "}, {"p": 7, "id": "m29", "title": "29. Mô hình tổ chức phòng Truyền thông", "body": " Phòng Truyền thông được tổ chức theo mô hình quản trị tập trung, phục vụ toàn bộ hệ sinh thái Organic Việt Nam và ADIGO.  BAN LÃNH ĐẠO ↓ GIÁM ĐỐC TRUYỀN THÔNG Chiến lược · Quản trị · Điều hành ↓ PR & Corporate Affairs Báo chí · Đối ngoại · Sự kiện Content & Digital Nội dung · Quản trị kênh Brand & Design Thương hiệu · Thiết kế Media Production Quay · Chụp · Dựng phim PHẠM VI PHỤC VỤ TOÀN HỆ SINH THÁI ORGANIC VIỆT NAM · FARM · FOOD · DISTRIBUTION · ADIGO · ADIGO MART · MARKETPLACE  29.1. Định biên nhân sự đề xuất  Vị trí Số lượng Trách nhiệm chính Giám đốc Truyền thông 01 Chiến lược, thương hiệu, đối ngoại, điều hành, ngân sách PR & Event Executive 01 Báo chí, đối ngoại, quan hệ cộng đồng, sự kiện Content & Digital Executive 01–02 Nội dung, biên tập, kịch bản, quản trị kênh Graphic Designer 01 Nhận diện, thiết kế, bao bì, ấn phẩm Multimedia Executive 01–02 Quay phim, chụp ảnh, dựng video Tổng cộng 05–07 Chưa bao gồm nhà cung cấp dịch vụ thuê ngoài  29.2. Nguyên tắc phát triển nhân sự  Giai đoạn đầu ưu tiên xây dựng đội ngũ có khả năng triển khai đa nhiệm, bảo đảm các chức năng thiết yếu.  Các dự án sản xuất TVC lớn, phim doanh nghiệp chuyên sâu, sự kiện quy mô lớn, nghiên cứu thương hiệu hoặc dịch vụ chuyên biệt có thể sử dụng nguồn lực thuê ngoài dưới sự quản trị của phòng Truyền thông. "}, {"p": 7, "id": "m30", "title": "30. Phân quyền và phối hợp liên phòng ban", "body": " 30.1. Phân định chức năng  Bộ phận Vai trò cốt lõi Truyền thông Thương hiệu, danh tiếng, nhận thức, niềm tin và nội dung doanh nghiệp Marketing Nghiên cứu thị trường, tạo nhu cầu, chiến dịch tiếp thị và chuyển đổi Kinh doanh Phát triển khách hàng, đại lý, CTV, chốt đơn và doanh thu ORGANIC FARM Nguồn nguyên liệu, sản xuất và dữ liệu sản xuất ORGANIC FOOD, QA Phát triển sản phẩm và kiểm soát chất lượng ORGANIC DISTRIBUTION Chuỗi cung ứng và lưu chuyển hàng hóa ADIGO, Công nghệ Nền tảng công nghệ, dữ liệu, hệ thống và tính năng Hệ thống bán lẻ Trải nghiệm mua hàng và dịch vụ trực tiếp Nhân sự Tổ chức, văn hóa, tuyển dụng và phát triển đội ngũ Tài chính Ngân sách, chi phí, kiểm soát tài chính Pháp chế Rà soát pháp lý, hợp đồng, phát ngôn và nội dung có rủi ro  30.2. Ma trận trách nhiệm RACI  A: Chịu trách nhiệm cuối cùng; R: Trực tiếp thực hiện; C: Tham vấn, phối hợp; I: Được thông báo.  Hạng mục Đơn vị A Đơn vị R Đơn vị C Chiến lược truyền thông Ban lãnh đạo Truyền thông Các đơn vị Quản trị thương hiệu Truyền thông Truyền thông Marketing, Công nghệ Báo chí và đối ngoại Truyền thông PR & Event Lãnh đạo, pháp chế Truyền thông sản phẩm Truyền thông Content, Design, Media FOOD, QA, Marketing Xác minh thông tin sản xuất FARM Kỹ thuật sản xuất Truyền thông Xác minh chất lượng QA FOOD, QA Pháp chế, Truyền thông Truyền thông chuỗi cung ứng Truyền thông Content, Media DISTRIBUTION Xác minh năng lực giao nhận DISTRIBUTION Vận hành Kinh doanh Truyền thông ADIGO Truyền thông Content, Design, Media Công nghệ Xác minh tính năng ADIGO Công nghệ Đội ngũ sản phẩm Truyền thông Quảng cáo chuyển đổi Marketing Marketing Truyền thông, Kinh doanh Chiến dịch bán hàng Kinh doanh Marketing, Sale Truyền thông, Vận hành Sự kiện thương hiệu Truyền thông PR & Event Các đơn vị Sự kiện thương mại Kinh doanh Marketing, Sale Truyền thông Truyền thông nội bộ Nhân sự Nhân sự, Truyền thông Các đơn vị Điều phối truyền thông khủng hoảng Truyền thông Tổ xử lý khủng hoảng Chuyên môn, pháp chế Xử lý sự cố chuyên môn Đơn vị có thẩm quyền Bộ phận chuyên môn Truyền thông  Ban lãnh đạo giữ quyền phê duyệt ngân sách, chiến lược, phát ngôn và các quyết định quan trọng theo quy chế phân quyền.  30.3. Cơ chế phối hợp thông tin  Mỗi cấu phần trong hệ sinh thái cần có đầu mối cung cấp và xác nhận thông tin cho phòng Truyền thông.  Phòng Truyền thông không tự xác lập số liệu sản xuất, tiêu chuẩn chất lượng, thông tin công nghệ, năng lực giao nhận hoặc chính sách thương mại khi chưa có xác nhận từ đơn vị phụ trách. "}, {"p": 7, "id": "m31", "title": "31. Quy trình vận hành truyền thông", "body": " 01 Tiếp nhận yêu cầu 02 Lập kế hoạch 03 Thu thập dữ liệu 04 Xác minh chuyên môn 05 Sản xuất nội dung 06 Kiểm duyệt 07 Phê duyệt 08 Xuất bản 09 Đo lường hiệu quả 10 Lưu trữ & cải tiến  Nội dung được phân loại theo mức độ rủi ro để xác định cấp phê duyệt. Các nội dung thường xuyên được thực hiện theo kế hoạch đã duyệt; thông tin nhạy cảm, phát ngôn chính thức, thông tin chất lượng và sự cố phải được xác minh và phê duyệt theo thẩm quyền. "}, {"p": 7, "id": "m32", "title": "32. Hệ thống tài liệu quản trị bắt buộc", "body": " Mã tài liệu Tên tài liệu COM-01 Chiến lược truyền thông tổng thể COM-02 Kế hoạch truyền thông năm, quý, tháng COM-03 Quy chế tổ chức và hoạt động phòng Truyền thông COM-04 Quy chuẩn kiến trúc và quản trị thương hiệu COM-05 Quy chuẩn thông điệp và thuật ngữ toàn hệ sinh thái COM-06 Quy trình sản xuất, kiểm duyệt và phê duyệt nội dung COM-07 Quy chế phát ngôn và quan hệ báo chí COM-08 Quy trình quản trị danh tiếng và khủng hoảng COM-09 Quy trình tổ chức sự kiện COM-10 Quy trình quản trị tài nguyên truyền thông COM-11 Quy chế phối hợp liên phòng ban COM-12 Quy trình quản lý ngân sách và nhà cung cấp COM-13 Bộ KPI và hệ thống báo cáo COM-14 Quy trình quản trị kênh và tài khoản truyền thông COM-15 Quy trình truyền thông ra mắt sản phẩm và công nghệ "}, {"p": 8, "id": "m33", "title": "33. Nguyên tắc xây dựng ngân sách", "body": " Ngân sách truyền thông được xây dựng độc lập với ngân sách Marketing bán hàng nhưng có cơ chế phối hợp trong các chiến dịch tích hợp.  Ngân sách cần phục vụ ba nhóm mục tiêu: duy trì năng lực vận hành phòng Truyền thông, phát triển tài sản thương hiệu dài hạn và triển khai các chiến dịch trọng điểm.  Không phân bổ ngân sách đồng đều cho tất cả cấu phần trong hệ sinh thái. Ưu tiên nguồn lực cho các hoạt động đã có năng lực triển khai, có giá trị chiến lược và trực tiếp hỗ trợ mục tiêu kinh doanh năm 2027. "}, {"p": 8, "id": "m34", "title": "34. Các phương án ngân sách đề xuất", "body": " PHƯƠNG ÁN A · 1,8 tỷ Tinh gọn · 150 triệu/tháng PHƯƠNG ÁN B · 3 tỷ Phát triển · 250 triệu/tháng PHƯƠNG ÁN C · 4,8 tỷ Mở rộng · 400 triệu/tháng  Phương án Định hướng triển khai A – Tinh gọn Tập trung nhân sự cốt lõi, nhận diện, nội dung thực tế và truyền thông sản phẩm B – Phát triển Phát triển đầy đủ các chức năng truyền thông, báo chí, sự kiện và ADIGO C – Mở rộng Tăng cường sản xuất nội dung chuyên nghiệp, chiến dịch quy mô lớn và quan hệ truyền thông  Các phương án trên là kịch bản hoạch định ngân sách, chưa phải dự toán chính thức dựa trên báo giá và quỹ lương thực tế. "}, {"p": 8, "id": "m35", "title": "35. Cơ cấu phân bổ ngân sách", "body": " Lấy phương án B với ngân sách 3 tỷ đồng/năm làm cơ sở xây dựng dự toán tham chiếu.  Mô hình dự toán ngân sách 2027 Nhân sự phòng Truyền thông 35% Sản xuất hình ảnh, video và TVC 15% Thương hiệu, thiết kế và ấn phẩm 10% Báo chí và quan hệ công chúng 10% Sự kiện và trải nghiệm 12% Phân phối nội dung truyền thông số 10% Công cụ, phần mềm và dữ liệu 3% Dự phòng và xử lý phát sinh 5% Ngân sách tham chiếu: 3.000 triệu đồng/năm · 250 triệu đồng/tháng.  Ngân sách trên không bao gồm chiết khấu đại lý, hoa hồng CTV, khuyến mãi thương mại, chi phí xây dựng cửa hàng, vận hành chuỗi cung ứng hoặc quảng cáo chuyển đổi thuộc ngân sách Marketing. "}, {"p": 8, "id": "m36", "title": "36. Phân bổ ngân sách theo quý", "body": " Quý I · 1.050 triệu 35% Quý II · 660 triệu 22% Quý III · 600 triệu 20% Quý IV · 690 triệu 23% Minh họa theo phương án ngân sách 3 tỷ đồng/năm.  Giai đoạn Tỷ trọng Ngân sách Trọng tâm Quý I 35% 1.050 triệu Nền tảng thương hiệu, sản phẩm gà, chiến dịch Tết Quý II 22% 660 triệu Chất lượng, phát triển danh mục và ADIGO Quý III 20% 600 triệu Thị trường, đối tác, chuỗi cung ứng, cộng đồng Quý IV 23% 690 triệu Hệ sinh thái, sự kiện, danh tiếng và tổng kết Tổng cộng 100% 3.000 triệu  Ngân sách chuẩn bị trong tháng 11–12/2026 cần được xây dựng và phê duyệt riêng, không mặc định tính vào ngân sách hoạt động năm 2027. "}, {"p": 8, "id": "m37", "title": "37. Cơ chế quản trị ngân sách", "body": " Mọi khoản chi truyền thông phải gắn với kế hoạch, dự án hoặc chiến dịch cụ thể. Việc quản lý ngân sách bao gồm lập dự toán, phê duyệt, lựa chọn nhà cung cấp, nghiệm thu, thanh toán và đánh giá hiệu quả.  Giám đốc Truyền thông chịu trách nhiệm đề xuất phân bổ, theo dõi thực hiện và kiểm soát ngân sách trong phạm vi được phê duyệt.  Định kỳ hằng quý, cần rà soát hiệu quả đầu tư truyền thông để điều chỉnh nguồn lực giữa các cấu phần theo mức độ sẵn sàng, nhu cầu kinh doanh và kết quả thực tế. "}, {"p": 9, "id": "m38", "title": "38. Khung đánh giá hiệu quả truyền thông", "body": " Hiệu quả truyền thông được đánh giá thông qua bốn cấp độ, từ kết quả triển khai đến tác động thực tế đối với doanh nghiệp.  01 OUTPUT – Kết quả triển khai Bài viết, video, sự kiện, ấn phẩm và độ phủ. 02 OUTTAKE – Mức độ tiếp nhận Khách hàng hiểu và ghi nhớ gì về doanh nghiệp. 03 OUTCOME – Thay đổi nhận thức Niềm tin, mức độ ưu tiên lựa chọn và ý định mua. 04 IMPACT – Tác động doanh nghiệp Danh tiếng, phát triển thị trường và quan hệ hợp tác.  Không sử dụng số lượng bài đăng, lượt theo dõi hoặc lượt xem làm tiêu chí duy nhất để đánh giá thành công của truyền thông. "}, {"p": 9, "id": "m39", "title": "39. Bộ KPI cấp chiến lược năm 2027", "body": " Nhóm Chỉ tiêu Mục tiêu đề xuất Thương hiệu Nhận biết có hỗ trợ tại thị trường trọng điểm ≥ 50% Thương hiệu Mức độ tin tưởng trong nhóm biết thương hiệu ≥ 70% Nhận thức Hiểu đúng mô hình sản xuất trong nhóm đã tiếp cận ≥ 70% Nhận diện Tuân thủ quy chuẩn thương hiệu 100% Website Lượt truy cập trong năm 100.000 Digital Tổng lượt tiếp cận nội dung 5 triệu Digital Tổng lượt xem video 2 triệu Facebook Người theo dõi phù hợp thị trường mục tiêu 20.000 Báo chí Bài viết, phóng sự phù hợp định vị 20–30 Nội dung Bài viết truyền thông gốc 250–350 Multimedia Video ngắn 150–200 Multimedia Video chuyên sâu 12–24 Thương hiệu Phim giới thiệu doanh nghiệp 1–2 Sự kiện Hoạt động tham quan, trải nghiệm 8–12 Đối ngoại Đầu mối đối tác tiềm năng được xác minh 100 ADIGO Chiến dịch giới thiệu năng lực công nghệ 2–4 Nội bộ Nhân viên được phổ biến thông điệp 100% Vận hành Hoàn thành nhiệm vụ đúng tiến độ ≥ 95% Kiểm duyệt Nội dung thuộc diện bắt buộc được xác minh 100% Khủng hoảng Tiếp nhận và báo cáo sự cố nghiêm trọng Trong 60 phút Tài chính Chi phí thực hiện Trong ngân sách được duyệt  Các mục tiêu trên là chỉ tiêu đề xuất để xây dựng kế hoạch. Phòng Truyền thông cần thực hiện khảo sát ban đầu, xác lập dữ liệu nền và thống nhất cách tính trước khi Ban lãnh đạo giao KPI chính thức.  Lượt tiếp cận trên nhiều nền tảng không được mặc định là số người duy nhất. Nội dung đăng lại cần được phân biệt với nội dung sản xuất mới. "}, {"p": 9, "id": "m40", "title": "40. KPI theo cấu phần hệ sinh thái", "body": " Cấu phần Nhóm chỉ số đánh giá ORGANIC VIỆT NAM Nhận biết thương hiệu, uy tín, chất lượng báo chí, quan hệ đối tác ORGANIC FARM Mức độ hiểu nguồn sản xuất, mô hình thảo dược, niềm tin về nguồn gốc ORGANIC FOOD Mức độ hiểu sản phẩm, chất lượng cảm nhận, ý định mua ORGANIC DISTRIBUTION Mức độ hiểu năng lực cung ứng, niềm tin vào bảo quản và giao nhận ADIGO Nhận biết công nghệ, hiểu năng lực nền tảng, mức độ quan tâm sử dụng ADIGO MART Nhận biết điểm bán, trải nghiệm và phản hồi khách hàng ADIGO MARKETPLACE Mức độ quan tâm của nhà cung cấp, nhà bán hàng và đối tác  KPI đối với các cấu phần chưa vận hành thương mại được đánh giá theo mức độ hoàn thiện nền tảng truyền thông và khả năng chuẩn bị ra mắt, không áp đặt chỉ tiêu người dùng hoặc doanh thu. "}, {"p": 9, "id": "m41", "title": "41. KPI Giám đốc Truyền thông", "body": " Giá trị thương hiệu và danh tiếng 25% Truyền thông sản phẩm, hỗ trợ kinh doanh 25% Báo chí, đối ngoại và sự kiện 15% Nội dung, sáng tạo và truyền thông số 15% Quản trị nhân sự, tiến độ và ngân sách 10% Truyền thông nội bộ và kiểm soát rủi ro 10%  Nhóm KPI hỗ trợ kinh doanh được đánh giá thông qua mức độ đóng góp của truyền thông vào nhận biết sản phẩm, tiếp nhận nhu cầu, hỗ trợ hệ thống bán hàng và phát triển niềm tin khách hàng. Doanh thu và tỷ lệ chốt đơn là chỉ tiêu phối hợp với Marketing và Kinh doanh, không phải trách nhiệm độc lập của phòng Truyền thông. "}, {"p": 9, "id": "m42", "title": "42. Hệ thống báo cáo quản trị", "body": " Báo cáo Tần suất Đối tượng nhận Báo cáo công việc và tiến độ Hằng tuần Giám đốc Truyền thông Báo cáo nội dung và kênh Hằng tuần Giám đốc Truyền thông Báo cáo KPI và ngân sách Hằng tháng Ban lãnh đạo Báo cáo phối hợp thương mại Theo chiến dịch Marketing, Kinh doanh, lãnh đạo Báo cáo báo chí và dư luận Hằng tuần/khi phát sinh Giám đốc Truyền thông Báo cáo hiệu quả chiến dịch Sau mỗi chiến dịch Ban lãnh đạo và đơn vị phối hợp Báo cáo thương hiệu và danh tiếng Hằng quý Ban lãnh đạo Báo cáo rủi ro truyền thông Khi phát sinh Ban lãnh đạo Báo cáo tổng kết năm Cuối năm Ban lãnh đạo  Hệ thống báo cáo cần được tổ chức tập trung thông qua Dashboard quản trị, liên kết dữ liệu công việc, nội dung, ngân sách, chiến dịch, KPI và các vấn đề cần xử lý. "}, {"p": 10, "id": "m43", "title": "43. Master Project Portfolio 2027", "body": " Danh mục dự án được tổ chức thành sáu nhóm, bao phủ toàn bộ chức năng của phòng Truyền thông và kiến trúc hệ sinh thái Organic Việt Nam.  Quy ước mức độ ưu tiên:  P1: Cấp thiết, cần hoàn thành để phục v  tác nghiệp như viết bài, thiết kế, quay phim hoặc dựng video. Các nhiệm vụ đó cần được giao cho đội ngũ chuyên môn, dưới sự định hướng và kiểm soát chất lượng của Giám đốc. "}, {"p": 11, "id": "m47", "title": "47. Cơ chế điều hành định kỳ", "body": " Tần suất Nội dung điều hành Hằng ngày Giám sát thông tin, phê duyệt nội dung, xử lý phát sinh Thứ Hai Họp phòng, phân công và kiểm tra kế hoạch tuần Thứ Ba Phối hợp Marketing, Kinh doanh, FARM, FOOD, DISTRIBUTION, ADIGO Thứ Tư Kiểm tra tiến độ sản xuất nội dung và các dự án Thứ Năm Quan hệ báo chí, đối ngoại, đối tác và sự kiện Thứ Sáu Đánh giá KPI, ngân sách, tiến độ và báo cáo Hằng tháng Rà soát chiến dịch, nguồn lực và hiệu quả Hằng quý Đánh giá thương hiệu, danh tiếng và điều chỉnh chiến lược Hằng năm Tổng kết, hoạch định chiến lược và ngân sách năm tiếp theo "}, {"p": 11, "id": "m48", "title": "48. Các nội dung trình Ban lãnh đạo phê duyệt", "body": " STT Nội dung 01 Chiến lược truyền thông tổng thể 2027 02 Kiến trúc hệ sinh thái và quản trị thương hiệu 03 Định vị, thông điệp và quy chuẩn thuật ngữ 04 Cơ cấu tổ chức và định biên phòng Truyền thông 05 Chức năng, nhiệm vụ và quyền hạn Giám đốc Truyền thông 06 Ngân sách hoạt động năm 2027 07 Danh mục dự án và chiến dịch trọng điểm 08 Cơ chế phối hợp giữa các phòng ban và cấu phần 09 Hệ thống KPI và báo cáo quản trị 10 Kế hoạch triển khai 90 ngày đầu tiên 11 Quy chế phát ngôn và quản trị khủng hoảng 12 Lộ trình phát triển truyền thông ADIGO, bán lẻ và Marketplace "}, {"p": 12, "id": "m49", "title": "49. Sơ đồ chiến lược truyền thông tổng thể 2027", "body": " CHIẾN LƯỢC TRUYỀN THÔNG 2027 ORGANIC VIỆT NAM & ADIGO NỀN TẢNG PHÁT TRIỂN NÔNG NGHIỆP Phát triển năng lực sản xuất và nguồn nguyên liệu. THỰC PHẨM Phát triển sản phẩm, chất lượng và giá trị gia tăng. CÔNG NGHỆ Quản trị, kết nối dữ liệu, thương mại và thị trường. KIẾN TRÚC HỆ SINH THÁI FARM Nguyên liệu FOOD Sản phẩm DISTRIBUTION Lưu chuyển ADIGO Thương mại CUSTOMER Giá trị ADIGO – HẠ TẦNG CÔNG NGHỆ XUYÊN SUỐT Quản trị · Dữ liệu · Truy xuất · Kết nối ↶ Dữ liệu · Nhu cầu · Phản hồi khách hàng TỪ NÔNG NGHIỆP ĐẾN BÀN ĂN ADIGO MART Bán lẻ ADIGO MARKETPLACE Thương mại số 10 TRỤ CỘT TRUYỀN THÔNG 01 Quản trị thương hiệu ↗ 02 Truyền thông doanh nghiệp ↗ 03 Sản phẩm & chuỗi giá trị ↗ 04 Truyền thông ADIGO ↗ 05 Báo chí & quan hệ công chúng ↗ 06 Truyền thông lãnh đạo ↗ 07 Truyền thông số ↗ 08 Sự kiện & trải nghiệm ↗ 09 Cộng đồng & nội bộ ↗ 10 Danh tiếng & khủng hoảng ↗ TỔ CHỨC – NHÂN SỰ – NGÂN SÁCH – KPI Hệ thống quản trị và thực thi CUSTOMER Khách hàng · Người tiêu dùng · Đối tác THƯƠNG HIỆU Nhận biết NIỀM TIN Danh tiếng THỊ TRƯỜNG Phát triển TÍCH LŨY GIÁ TRỊ – PHÁT TRIỂN BỀN VỮNG Sơ đồ tổng thể liên kết chiến lược kinh doanh, kiến trúc hệ sinh thái và hệ thống truyền thông Organic Việt Nam năm 2027. "}, {"p": 12, "id": "m50", "title": "50. Kết luận chiến lược", "body": " Chiến lược truyền thông tổng thể 2027 được xây dựng trên cơ sở định hướng phát triển Organic Việt Nam thành hệ sinh thái kinh doanh tích hợp giữa nông nghiệp, thực phẩm, chuỗi cung ứng, công nghệ và thương mại.  Trong đó:  ORGANIC FARM tạo nền tảng sản xuất nông nghiệp và nguồn nguyên liệu.  ORGANIC FOOD phát triển sản phẩm và tạo giá trị gia tăng từ thực phẩm.  ORGANIC DISTRIBUTION phát triển năng lực tổ chức chuỗi cung ứng, bảo quản, vận chuyển và phân phối.  ADIGO phát triển nền tảng công nghệ quản trị, kết nối dữ liệu và tổ chức hoạt động thương mại.  ADIGO MART phát triển hệ thống bán lẻ trực tiếp và trải nghiệm khách hàng.  ADIGO MARKETPLACE mở rộng khả năng kết nối nguồn cung, đối tác kinh doanh và thị trường.  Toàn bộ hệ sinh thái được quản trị dưới định hướng chiến lược chung của Organic Việt Nam, lấy chất lượng sản phẩm và giá trị khách hàng làm trọng tâm.  Trên nền tảng đó, phòng Truyền thông có trách nhiệm xây dựng một hệ thống thông tin và thương hiệu nhất quán, giúp thị trường nhận biết đúng, hiểu đúng và tin tưởng vào những giá trị mà doanh nghiệp đang tạo dựng.  Năm 2027 không chỉ là năm giới thiệu sản phẩm ra thị trường mà còn là năm xây dựng nền móng thương hiệu, danh tiếng, năng lực truyền thông và quan hệ đối tác cho quá trình phát triển dài hạn.  ĐỊNH VỊ THƯƠNG HIỆU Kiến tạo hệ sinh thái giá trị · Nông nghiệp · Thực phẩm · Công nghệ CÔNG THỨC CHIẾN LƯỢC FARM → FOOD → DISTRIBUTION → ADIGO → CUSTOMER ĐỊNH HƯỚNG TRUYỀN THÔNG 2027 Xây dựng thương hiệu. Tạo dựng niềm tin. Phát triển thị trường. GIÁ TRỊ PHÁT TRIỂN DÀI HẠN Chất lượng sản phẩm – Giá trị khách hàng – Năng lực hệ sinh thái. "}, {"p": 13, "id": "", "title": "PHỤ LỤC. HỆ THỐNG TÀI LIỆU TRIỂN KHAI SAU CHIẾN LƯỢC", "body": "Sau khi chiến lược tổng thể được phê duyệt, Giám đốc Truyền thông chịu trách nhiệm cụ thể hóa thành các tài liệu quản trị và kế hoạch tác nghiệp. STT Tài liệu Mục đích 01 Chiến lược truyền thông tổng thể 2027 Định hướng cấp doanh nghiệp 02 Kế hoạch hành động truyền thông 2027 Chi tiết tháng, quý, chiến dịch, deadline 03 Kế hoạch truyền thông sản phẩm gà – Tết 2027 Triển khai mục tiêu thương mại cấp thiết 04 Đề án tổ chức và vận hành phòng Truyền thông Nhân sự, cơ cấu, chức năng, phân quyền 05 Dự toán ngân sách truyền thông 2027 Phân bổ nguồn lực và kiểm soát tài chính 06 Brand Guidelines – Organic Việt Nam & ADIGO Chuẩn hóa nhận diện toàn hệ sinh thái 07 Corporate Messaging Guidelines Chuẩn hóa thông điệp và thuật ngữ 08 Kế hoạch PR, báo chí và sự kiện 2027 Phát triển đối ngoại và danh tiếng 09 Kế hoạch truyền thông ADIGO Phát triển thương hiệu công nghệ và thương mại 10 Master Content Plan 2027 Quản trị hệ thống nội dung và sáng tạo 11 Master Project Tracker Quản lý 57 dự án và nhóm công việc 12 Dashboard KPI truyền thông Kiểm soát tiến độ và hiệu quả 13 Bộ quy trình và quy chế truyền thông Chuẩn hóa hoạt động 14 Kế hoạch quản trị khủng hoảng Kiểm soát rủi ro và danh tiếng 15 Kế hoạch truyền thông nội bộ Phát triển văn hóa và năng lực tổ chức XÁC NHẬN VÀ PHÊ DUYỆT Người lập Người kiểm tra Người phê duyệt Giám đốc Truyền thông Ban Điều hành Cấp có thẩm quyền Ngày: …/…/…… Ngày: …/…/…… Ng short[Number(page.slice(1))-1];else if(page==='tracker')title='Master Project Tracker';else if(page==='all')title='Toàn văn chiến lược';$('#crumb').textContent='Organic Việt Nam / '+title;$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav==='#'+page||a.dataset.nav===location.hash));$$('[data-toc]').forEach(a=>a.classList.toggle('active',a.dataset.toc===target));closeNav();closeSearch();if(target){requestAnimationFrame(()=>{let el=document.getElementById(target);if(el){el.scrollIntoView({block:'start',behavior:'auto'});if(target.startsWith('project-')){el.style.background='#dfefdc';setTimeout(()=>el.style.background='',2200)}}else window.scrollTo(0,0)})}else if(!same)window.scrollTo(0,0);}
